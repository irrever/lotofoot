name: Pronosoft (repérage)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decouverte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repérer les pages de résultats
        run: python3 src/pronosoft.py loto
