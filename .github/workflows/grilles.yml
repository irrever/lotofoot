name: Grilles Loto Foot

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Une seule exécution à la fois : deux envois simultanés se disputeraient les mêmes fichiers.
concurrency:
  group: grilles
  cancel-in-progress: false

jobs:
  grilles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lire les grilles publiées
        run: python3 scripts/grilles.py
      - name: Enregistrer les grilles si elles ont changé
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grilles
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Grilles : mise à jour automatique"
          # Le dépôt peut être mis à jour pendant l'exécution (autres publications sur main) :
          # on récupère la branche avant chaque envoi, et on recommence en cas de refus.
          delai=2
          for essai in 1 2 3 4; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "Grilles envoyées (essai $essai)."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$essai" -lt 4 ]; then
              echo "Envoi refusé (essai $essai) ; nouvel essai dans $delai s."
              sleep "$delai"
              delai=$((delai * 2))
            fi
          done
          echo "L'envoi des grilles a échoué après 4 essais." >&2
          exit 1
