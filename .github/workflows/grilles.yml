name: Grilles Loto Foot

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grilles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lire les grilles publiées
        run: python3 scripts/grilles.py
      - name: Enregistrer les grilles si elles ont changé
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grilles
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Grilles : mise à jour automatique"
            git push
          fi
