name: Statistiques Lotofoot

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Une seule mise à jour à la fois : elles écrivent dans les mêmes fichiers.
concurrency:
  group: statistiques
  cancel-in-progress: false

jobs:
  statistiques:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Partir de la dernière version de main, et non du commit de déclenchement : une exécution précédente
      # peut avoir publié entre-temps, et ses fichiers générés entreraient en conflit avec les nôtres.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Installer les dépendances
        run: python3 -m pip install -r requirements.txt
      - name: Relever les blessés, suspendus et meilleurs buteurs (foot-actu)
        # Sans relevé récent, le modèle garde ses probabilités sans malus : la mise à jour n’est pas bloquée.
        continue-on-error: true
        run: python3 src/footactu.py collecter
      - name: Relever les scores des grilles du Loto Foot (Pronosoft)
        # Sans ce relevé, les matchs de grille hors championnats suivis restent sans résultat : la mise à jour n’est pas bloquée.
        continue-on-error: true
        run: python3 src/pronosoft.py collecter
      - name: Récupérer les résultats, mettre à jour le modèle, le journal et le bilan
        run: |
          mkdir -p data/raw
          sh src/boucle.sh
      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp standalone/site/index.html standalone/site/donnees.json standalone/site/sw.js \
             standalone/site/manifest.webmanifest standalone/site/icone-192.png standalone/site/icone-512.png .
          git add index.html donnees.json sw.js manifest.webmanifest icone-192.png icone-512.png \
                  data/donnees_publiees.json data/model_state.json data/historique data/bilan data/journal data/resultats.json
          if [ -d rapports ]; then git add rapports; fi
          if [ -d data/resultats ]; then git add data/resultats; fi
          for f in data/absences/du_jour.json data/absences/chemins_footactu.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Statistiques : mise à jour automatique"
          # Le dépôt peut être mis à jour pendant l'exécution (grilles, autres publications) :
          # on récupère la branche avant chaque envoi, et on recommence en cas de refus.
          delai=2
          for essai in 1 2 3 4; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "Données envoyées (essai $essai)."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$essai" -lt 4 ]; then
              echo "Envoi refusé (essai $essai) ; nouvel essai dans $delai s."
              sleep "$delai"
              delai=$((delai * 2))
            fi
          done
          echo "L'envoi des données a échoué après 4 essais." >&2
          exit 1
