name: Chemins foot-actu (repérage)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chemins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Construire la liste des pages
        run: python3 src/footactu.py chemins
      - name: Enregistrer la liste des pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/absences/chemins_footactu.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Chemins des pages foot-actu par championnat"
          git pull --rebase -q origin main && git push -q origin HEAD:main
