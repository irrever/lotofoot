name: Découverte foot-actu (structure)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decouverte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repérer la structure des pages
        run: python3 scripts/decouverte_footactu.py
