<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotofoot Analyse</title>
<style>
:root {
  color-scheme: light;
  --bg: #f2f4f1; --surface: #ffffff; --surface-2: #f6f8f5; --fg: #15211a; --muted: #56635c; --line: #dde2dc;
  --ok: #1d6a48; --ok-soft: #e3f1e9; --ok-line: #a9d3bc; --ok-fg: #ffffff;
  --warn: #7a4e00; --warn-soft: #fbf1d8; --warn-line: #e6c372; --warn-dot: #9a6400;
  --info: #1f5fbf; --info-soft: #e7f0fc; --info-line: #a6c3ee;
  --hyp: #5a3cae; --hyp-soft: #eee9fb; --hyp-line: #bfaeee;
  --bad: #b3261e; --bad-soft: #fdecea; --bad-line: #f1aaa4;
  --c1: #1d6a48; --cN: #6b7785; --c2: #2563eb;
  --c1-soft: #e3f1e9; --cN-soft: #eef1f4; --c2-soft: #e7f0fc;
  --puce-fg: #ffffff; --num-fg: #ffffff;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(21, 33, 26, .06), 0 6px 18px rgba(21, 33, 26, .06);
  --r: 16px; --r-s: 12px;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #0f1411; --surface: #161d19; --surface-2: #1c2520; --fg: #eef2ee; --muted: #a6b3aa; --line: #2b3732;
    --ok: #63c595; --ok-soft: #1a3a2a; --ok-line: #2f6a4b; --ok-fg: #0b150f;
    --warn: #f2c97a; --warn-soft: #3a2c12; --warn-line: #7d6221; --warn-dot: #f0b43a;
    --info: #8db8ff; --info-soft: #18284a; --info-line: #2f4f8f;
    --hyp: #c7b6ff; --hyp-soft: #2a2150; --hyp-line: #5d4ca6;
    --bad: #ff9c94; --bad-soft: #3d1e1c; --bad-line: #7d3b36;
    --c1: #63c595; --cN: #b3bdc7; --c2: #8db8ff; --c1-soft: #1a3a2a; --cN-soft: #252d35; --c2-soft: #18284a;
    --puce-fg: #0b150f; --num-fg: #0b150f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1411; --surface: #161d19; --surface-2: #1c2520; --fg: #eef2ee; --muted: #a6b3aa; --line: #2b3732;
  --ok: #63c595; --ok-soft: #1a3a2a; --ok-line: #2f6a4b; --ok-fg: #0b150f;
  --warn: #f2c97a; --warn-soft: #3a2c12; --warn-line: #7d6221; --warn-dot: #f0b43a;
  --info: #8db8ff; --info-soft: #18284a; --info-line: #2f4f8f;
  --hyp: #c7b6ff; --hyp-soft: #2a2150; --hyp-line: #5d4ca6;
  --bad: #ff9c94; --bad-soft: #3d1e1c; --bad-line: #7d3b36;
  --c1: #63c595; --cN: #b3bdc7; --c2: #8db8ff; --c1-soft: #1a3a2a; --cN-soft: #252d35; --c2-soft: #18284a;
  --puce-fg: #0b150f; --num-fg: #0b150f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.gauche { text-align: left; }
.res-chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--line); color: var(--muted, #5b6b62); }
.res-chip.v { color: var(--ok); }
.res-chip.d { color: var(--bad); }
.sel-matchs td { padding: 6px 4px; }
.sous-titre { font-weight: 700; margin: 12px 0 2px; }
.sel-tab { table-layout: fixed; }
.sel-tab th:first-child, .sel-tab td:first-child { width: 40%; }
.sel-tab td, .sel-matchs td { font-family: inherit; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.page { max-width: 1040px; margin: 0 auto; padding: 0 16px 112px; }
.ico { display: block; flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* En-tête : identité et état des données */
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; padding: 14px 0 10px; }
.marque { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 13px; background: var(--ok); color: var(--ok-fg); font: 800 21px/1 var(--sans); box-shadow: var(--shadow); }
.head h1 { margin: 0; font: 700 22px/1.15 var(--sans); letter-spacing: -0.01em; }
.accroche { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.etat { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font: 600 13px/1.3 var(--sans); }
.etat::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.etat.ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.etat.warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.etat.hyp { color: var(--hyp); background: var(--hyp-soft); border-color: var(--hyp-line); }
.etat.bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
.etat.info { color: var(--info); background: var(--info-soft); border-color: var(--info-line); }

/* Navigation : onglets en haut sur ordinateur, barre fixe en bas sur téléphone */
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 4px 0 0; border-bottom: 1px solid var(--line); }
.tabs button { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; min-height: 50px; padding: 10px 12px; border: 0; border-bottom: 3px solid transparent; border-radius: 10px 10px 0 0; background: transparent; color: var(--muted); font: 600 15px/1.2 var(--sans); cursor: pointer; transition: background-color .15s, color .15s; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--ok); border-bottom-color: var(--ok); background: var(--ok-soft); }

/* Zones : chaque bloc a un numéro, un titre et une couleur */
.contenu { min-width: 0; }
.zone { position: relative; min-width: 0; margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-left: 5px solid var(--tone, var(--line)); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.zone[data-tone="ok"] { --tone: var(--ok); }
.zone[data-tone="info"] { --tone: var(--info); }
.zone[data-tone="warn"] { --tone: var(--warn-dot); }
.zone[data-tone="hyp"] { --tone: var(--hyp); }
.zone[data-tone="bad"] { --tone: var(--bad); }
.zone[data-tone="neutre"] { --tone: var(--muted); }
.zone-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; margin-bottom: 14px; }
.zone-num { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tone, var(--muted)); color: var(--num-fg); font: 700 14px/1 var(--sans); }
.zone-titre { min-width: 0; flex: 1 1 180px; }
.zone-head h2 { margin: 0; font: 700 18px/1.3 var(--sans); overflow-wrap: anywhere; }
.zone-titre .hint { margin-top: 2px; }
.zone-aside { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 18px; }
.page-title { margin: 0; font: 700 22px/1.2 var(--sans); }

/* Textes */
.hint { margin: 8px 0 0; font-size: 14px; color: var(--muted); text-wrap: pretty; }
.label { display: block; font: 500 13px/1.3 var(--sans); color: var(--muted); }
.note { margin: 14px 0 0; padding: 14px; border: 1px dashed var(--line); border-radius: var(--r-s); color: var(--muted); }
.flash { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0 0; padding: 12px 14px 12px 12px; border: 1px solid var(--info-line); border-radius: var(--r-s); background: var(--info-soft); color: var(--fg); font-size: 15px; }
.flash::before { content: ''; flex: none; align-self: stretch; width: 4px; border-radius: 4px; background: var(--info); }
.alerte { margin: 10px 0 0; padding: 10px 14px; border-left: 4px solid var(--warn); border-radius: var(--r-s); background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; }
.notice { margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--warn-line); border-radius: var(--r-s); background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.err { color: var(--bad); font-size: 14px; }
.vide { padding: 14px 4px 4px; text-align: center; }
.vide p { margin: 0 0 8px; }
.list { margin: 10px 0 0; padding: 0; list-style: none; }
.list li { position: relative; padding: 9px 0 9px 16px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.list li:first-child { border-top: 0; }
.list li::before { content: ''; position: absolute; left: 0; top: 17px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.list.err li { color: var(--bad); }
.list.err li::before { background: var(--bad); }

/* Boutons */
.btns, .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: var(--fg); font: 600 15px/1.2 var(--sans); text-align: center; text-decoration: none; cursor: pointer; transition: background-color .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ok); border-color: var(--ok); color: var(--ok-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad-line); }
.btn.petit { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.pick { min-height: 38px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: 600 14px/1.2 var(--sans); cursor: pointer; }
.pick.on { background: var(--ok); border-color: var(--ok); color: var(--ok-fg); }

/* Formulaires */
.field label { display: block; margin-bottom: 6px; font: 600 14px/1.3 var(--sans); }
select, .txtin { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: var(--fg); font: 500 16px var(--sans); }
select:focus, .txtin:focus { outline: none; border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.form-grille { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.form-grille .large { grid-column: 1 / -1; }
@media (min-width: 680px) { .form-grille { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rows { display: grid; gap: 10px; margin-top: 16px; }
.rowform { display: grid; grid-template-columns: 24px minmax(0, 1fr) 26px minmax(0, 1fr); gap: 3px; align-items: center; }
.rowform .num { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface-2); font: 600 14px/1 var(--mono); }
.rowform .txtin { min-height: 44px; padding-left: 8px; padding-right: 8px; }
.rowform .err { grid-column: 2 / 5; }

/* Grilles enregistrées : une tuile par grille, couleur selon l’état */
.tuiles { display: grid; gap: 10px; }
@media (min-width: 760px) { .tuiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tuile { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; width: 100%; min-width: 0; padding: 14px 14px 14px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.tuile::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 5px; border-radius: 0 4px 4px 0; background: var(--muted); }
.tuile.is-lock::before { background: var(--ok); }
.tuile.is-open::before { background: var(--warn-dot); }
.tuile:hover { border-color: var(--muted); }
.tuile.is-on { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.tuile-nom { min-width: 0; font: 700 16px/1.3 var(--sans); overflow-wrap: anywhere; }
.tuile-meta { grid-column: 1; font-size: 13px; color: var(--muted); }
.tuile .etat { grid-column: 1; justify-self: start; }
.tuile-proba { grid-column: 2; grid-row: 1 / span 3; text-align: right; }
.tuile-proba strong { display: block; margin-top: 2px; font: 700 22px/1.2 var(--mono); }

/* Cartes des matchs (les événements) */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 6px 0 14px; }
.kpi { min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface-2); }
.kpi strong { display: block; margin-top: 4px; font: 700 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-grand { grid-column: 1 / -1; border-color: var(--ok-line); background: var(--ok-soft); }
.kpi-grand strong { font-size: 34px; color: var(--ok); }
.kpis3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis3 .kpi strong { font-size: 22px; }
.kpi.k1 { border-top: 4px solid var(--c1); }
.kpi.kN { border-top: 4px solid var(--cN); }
.kpi.k2 { border-top: 4px solid var(--c2); }
.kpi.is-fav { background: var(--surface); box-shadow: 0 0 0 2px var(--ok-line); }
.match-titre { margin: 6px 0 0; font: 700 20px/1.25 var(--sans); overflow-wrap: anywhere; }
.matchs-liste { display: grid; gap: 14px; }
@media (min-width: 860px) { .matchs-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.match { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.match-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.match-num { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font: 700 15px/1 var(--mono); }
.match-ligue { min-width: 0; font-size: 13px; color: var(--muted); }
.match-top .tag { margin-left: auto; }
.match-equipes { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.equipe { min-width: 0; }
.equipe.ext { text-align: right; }
.equipe-role { display: block; font: 600 12px/1.3 var(--sans); color: var(--muted); }
.equipe-nom { display: block; font: 700 18px/1.25 var(--sans); overflow-wrap: anywhere; }
.equipe-rang { display: block; font: 500 12px/1.3 var(--sans); color: var(--muted); }
.vs { font: 600 13px/1 var(--sans); color: var(--muted); }
.barre { display: flex; height: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.seg { display: block; height: 100%; }
.seg.s1 { background: var(--c1); }
.seg.sN { background: var(--cN); }
.seg.s2 { background: var(--c2); }
.probs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.prob { min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface-2); text-align: center; }
.prob span { display: block; font: 700 13px/1.2 var(--sans); }
.prob strong { display: block; font: 700 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.prob.p1 span { color: var(--c1); }
.prob.pN span { color: var(--cN); }
.prob.p2 span { color: var(--c2); }
.prob.is-pick.p1 { border: 2px solid var(--c1); background: var(--c1-soft); }
.prob.is-pick.pN { border: 2px solid var(--cN); background: var(--cN-soft); }
.prob.is-pick.p2 { border: 2px solid var(--c2); background: var(--c2-soft); }
.match-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; }
.pronos-label { color: var(--muted); }
.pronos { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.puce { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 8px; background: var(--muted); color: var(--puce-fg); font: 700 14px/1 var(--sans); }
.puce.p1 { background: var(--c1); }
.puce.pN { background: var(--cN); }
.puce.p2 { background: var(--c2); }
.legende { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--muted); font: 600 12px/1.4 var(--sans); white-space: nowrap; }
/* Ce qui a changé depuis la dernière mise à jour : flèche sur le pourcentage, signal « Nouveau » sur la carte */
.fleche { display: block; margin-top: 4px; font: 700 12px/1.2 var(--sans); }
.fleche.up { color: var(--ok); }
.fleche.down { color: var(--bad); }
.match.nouveau { border-left: 4px solid var(--warn-dot); }
.nouveau-tag { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.surprise-tag { color: #c62828; border-color: #c62828; font-weight: 700; }
.tag.absence-tag { color: #8a5a00; border-color: #c98a00; background: #fff4df; font-weight: 700; }
.alerte.alerte-absence { border-left-color: #c98a00; }
.case-chiffre.contre { border: 2px solid #c62828; }
.croix-rouge path:not(.halo) { stroke: #c62828; }
.choix-ligne { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 14px; }
.eu-diag { margin: 10px 0 0; font-weight: 600; font-size: 14px; }
.europe-details { margin-top: 10px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); font-size: 13px; }
.europe-details summary { cursor: pointer; font-weight: 700; }
.europe-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
@media (max-width: 380px) { .europe-grille { grid-template-columns: 1fr; } }
.europe-equipe > b { display: block; margin-bottom: 4px; }
.europe-equipe label { display: block; margin: 3px 0; }
.europe-ligne { margin: 4px 0; }
.suivi-banniere { margin: 12px 0 0; padding: 10px 14px; border-left: 4px solid var(--warn-dot); border-radius: var(--r-s); background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }
.alerte.alerte-neuve { box-shadow: inset 0 0 0 2px var(--warn-dot); }
.alerte.alerte-surprise { border-left-color: #c62828; box-shadow: inset 0 0 0 2px #c62828; }
/* Choix du modèle entre les deux équipes : un 1 ou un 2 colore l’équipe concernée ; la case du milieu n’existe que pour un match nul, cochée */
.txtin.m-1 { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 30%, var(--surface)); }
.txtin.m-2 { border-color: var(--c2); background: color-mix(in srgb, var(--c2) 30%, var(--surface)); }
.mchoix { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 32px; border-radius: 7px; }
.mchoix.coche { background: var(--cN); color: var(--bg); font: 700 14px/1 var(--sans); }
/* Liste des choix sous le titre d’une grille validée : une ligne par match, le choix retenu en couleur */
.recap { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.recap-ligne { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.recap-dom { min-width: 0; text-align: right; font-size: 14px; overflow-wrap: anywhere; }
.recap-ext { min-width: 0; text-align: left; font-size: 14px; overflow-wrap: anywhere; }
.recap-ligne:last-child { border-bottom: 0; }
.recap-equipes { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.recap-choix { display: inline-flex; gap: 4px; }
.recap-choix .puce.is-off { opacity: .22; }
/* Résultats : chaque match montre le choix joué (cases cochées, sans couleur), puis le résultat */
.ligne-choix { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; align-items: center; cursor: pointer; list-style: none; padding: 8px 4px; }
.ligne-choix::-webkit-details-marker { display: none; }
.ligne-num { color: var(--fg); font-size: 14px; align-self: start; padding-top: 1px; }
.ligne-corps { display: block; min-width: 0; }
.ligne-equipes { display: block; font-size: 15px; overflow-wrap: anywhere; }
.ligne-resultat { grid-column: 2 / 4; grid-row: 2; font-size: 14px; color: var(--fg); white-space: nowrap; }
.ligne-cases { display: inline-flex; gap: 4px; }
.case-chiffre { position: relative; display: flex; align-items: center; justify-content: center; width: 32px; height: 40px; border: 1.5px solid var(--muted); border-radius: 6px; background: var(--surface); color: var(--fg); }
.case-chiffre b { font: 800 24px/1 var(--sans); }
.case-chiffre.coche { border: 2px solid #e8730c; }
.croix { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); }
.croix path { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.croix .halo { stroke: var(--surface); stroke-width: 5; }
/* Case au-dessus du numéro : blanche, cochée en noir quand le match est couvert */
.ligne-gauche { display: grid; justify-items: center; gap: 5px; align-self: start; }
.ligne-gauche .ligne-num { line-height: 1; }
.tag.hyp { color: var(--hyp); background: var(--hyp-soft); border-color: var(--hyp-line); }
.tag.bad { color: var(--bad); background: var(--bad-soft); border-color: var(--bad-line); }
details.more { margin-top: 2px; }
details.more > summary { padding: 6px 0; color: var(--info); font: 600 14px/1.3 var(--sans); cursor: pointer; }
details.more[open] > summary { margin-bottom: 6px; }

/* Choix des équipes (onglet Match) */
.slots { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 10px; }
.slot { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; padding: 12px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface-2); }
.slot.is-rempli { border-style: solid; border-color: var(--ok-line); background: var(--ok-soft); }
.slot-role { font: 600 12px/1.3 var(--sans); color: var(--muted); }
.slot-nom { min-width: 0; font: 700 17px/1.25 var(--sans); overflow-wrap: anywhere; }
.slot-vide { font-size: 14px; color: var(--muted); }
.slot .btn { margin-top: 6px; }
.slots .vs { align-self: center; }

/* Tableaux */
.scroll { max-width: 100%; margin-top: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th { font: 600 13px/1.3 var(--sans); color: var(--muted); white-space: normal; }
th:first-child, td:first-child { text-align: left; font-family: var(--sans); white-space: normal; }
th.txt, td.txt { font-family: var(--mono); }

/* Méthode : rubriques repliables */
details.sect { margin-top: 10px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); box-shadow: var(--shadow); }
details.sect > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; font: 600 16px/1.3 var(--sans); cursor: pointer; list-style: none; }
details.sect > summary::-webkit-details-marker { display: none; }
details.sect > summary::after { content: '+'; color: var(--muted); font: 500 22px/1 var(--sans); }
details.sect[open] > summary::after { content: '–'; }
details.sect > .corps { padding: 0 0 16px; }
.corps p { margin: 0 0 10px; }
.corps ul { margin: 0; padding-left: 20px; }
.corps li { margin-bottom: 8px; }

/* Qualité des prédictions : une carte par méthode */
.methodes { margin-top: 6px; }
.methode-carte { padding: 14px 0; border-top: 1px solid var(--line); }
.methode-carte:first-child { border-top: 0; padding-top: 4px; }
.methode-carte h3 { margin: 0 0 10px; font: 700 15px/1.3 var(--sans); }
.methode-carte .kpi strong { font-size: 19px; }

/* Bilan d’observation */
.verdicts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 4px; }
@media (min-width: 680px) { .verdicts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.verdict { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface-2); }
.verdict strong { font: 700 26px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.verdict .hint { margin: 0; }
.verdict .etat { margin-top: 4px; }
.conclusion { margin: 14px 0 4px; font: 600 16px/1.45 var(--sans); }
.graphique { display: block; width: 100%; height: auto; margin-top: 10px; }
.axe-zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; opacity: .6; }
.axe-txt { fill: var(--muted); font: 500 11px var(--sans); }
.courbe-modele { fill: none; stroke: var(--c1); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.courbe-elo { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
.point-modele { fill: var(--c1); }
.legende-graph { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.trait { display: inline-block; width: 22px; margin: 0 4px 0 10px; vertical-align: middle; border-top: 3px solid var(--c1); }
.trait-elo { border-top: 2px dashed var(--muted); }
.sous-titre { margin: 18px 0 6px; font: 700 15px/1.3 var(--sans); }
.calibration { display: grid; gap: 16px; }
.cal-ligne { display: grid; gap: 6px; }
.cal-nom { display: flex; align-items: center; gap: 8px; font: 600 15px/1.3 var(--sans); }
.cal-barre { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; gap: 8px; }
.cal-barre .label { margin: 0; }
.cal-fond { display: block; height: 12px; overflow: hidden; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.cal-val { display: block; height: 100%; background: var(--muted); opacity: .4; }
.cal-val.p1 { background: var(--c1); opacity: 1; }
.cal-val.pN { background: var(--cN); opacity: 1; }
.cal-val.p2 { background: var(--c2); opacity: 1; }
.cal-barre strong { font: 700 15px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.championnats { display: grid; }
.championnat { padding: 10px 0; border-top: 1px solid var(--line); }
.championnat:first-child { padding-top: 2px; border-top: 0; }
.championnat-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.championnat-bas { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-top: 6px; }

  function viewMethode() {

        '<li>L’Elo du club : celui d’un club dominant de son championnat (3e meilleur club, d’après la relation observée dans les 16 championnats suivis), ou la moyenne entre ce niveau et la moyenne du championnat pour un club du haut de tableau.</li>' +
        '<li>Les autres statistiques sont les moyennes de toutes les équipes suivies.</li></ul>' +
        '<p>Ce sont des hypothèses, pas des données : les probabilités de ces matchs changent si le niveau supposé change. Le match indique le motif retenu pour chaque club.</p>', false) +
      section('Ce que montrent les tests',
        '<p>Sur des matchs d’un même championnat, le modèle fait mieux que les probabilités moyennes de l’historique. Il n’a pas été testé sur des matchs entre championnats.</p>', false) +
      section('Limites',
        '<ul><li>Le Lotofoot ne tient compte que du score à la fin du temps réglementaire : prolongations et tirs au but ne comptent pas.</li>' +

  // ---------- Affichage : bilan d’observation (progression du modèle, écarts, prévisions)
  var MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var NOM_ISSUE = { H: 'Victoire à domicile', D: 'Match nul', A: 'Victoire à l’extérieur' };
  var ETIQ_ISSUE = { H: '1', D: 'N', A: '2' };
  var CLASSE_ISSUE = { H: 'p1', D: 'pN', A: 'p2', '1': 'p1', 'N': 'pN', '2': 'p2' };
  function jourCourt(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    return m ? Number(m[3]) + ' ' + MOIS_COURT[Number(m[2]) - 1] : String(iso || '');
  }
  function signe(x, d) { return (x >= 0 ? '+' : '−') + fr(Math.abs(x), d); }
  function pcSigne(x) { return signe(x * 100, 1) + ' %'; }
  function intervalleTxt(e) {
    return (e && e.bas != null) ? 'intervalle à 95 % : ' + signe(e.bas, 3) + ' à ' + signe(e.haut, 3) : 'échantillon trop petit';
  }
  function verdictEcart(e) {
    if (!e || e.bas == null) return { tone: 'neutre', texte: 'Échantillon trop petit' };
    if (e.bas > 0) return { tone: 'ok', texte: 'Amélioration nette' };
    if (e.haut < 0) return { tone: 'bad', texte: 'Dégradation nette' };
    return { tone: 'warn', texte: 'Pas de différence démontrée' };
  }
  function conclusionBilan(vRef, vElo) {
    if (vRef.tone === 'ok' && vElo.tone === 'ok') return 'Le modèle fait mieux que la référence neutre et que l’Elo seul.';
    if (vRef.tone === 'ok' && vElo.tone === 'warn') return 'Le modèle fait mieux que la référence neutre, mais pas de façon démontrée mieux que l’Elo seul : pour l’instant, les autres statistiques n’ajoutent pas de gain mesurable.';
    if (vRef.tone === 'ok' && vElo.tone === 'bad') return 'Le modèle fait mieux que la référence neutre, mais moins bien que l’Elo seul sur cette période.';
    return 'L’avance du modèle sur la référence neutre n’est pas encore démontrée.';
  }
  // Avance cumulée, à partir de 100 matchs joués (les toutes premières journées sont trop peu nombreuses)
  function progression(semaines) {
    var cumul = 0, out = [];
    (semaines || []).forEach(function (s) {
      cumul += s.matchs;
      if (cumul >= 100) out.push({ lab: s.semaine, m: s.competence_cumulee, e: 1 - s.log_loss_elo_cumule / s.log_loss_reference_cumule });
    });
    return out;
  }
  function graphiqueProgression(pts) {
    if (pts.length < 2) return '<p class="hint">Pas encore assez de journées pour tracer la progression.</p>';
    var W = 360, H = 210, L = 46, R = 14, T = 14, B = 34;
    var vals = [0];
    pts.forEach(function (p) { vals.push(p.m, p.e); });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var marge = (max - min) * 0.15 || 0.01;
    var lo = min - marge, hi = max + marge;
    function X(i) { return L + (W - L - R) * i / (pts.length - 1); }
    function Y(v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); }
    function courbe(cle) {
      return pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p[cle]).toFixed(1); }).join(' ');
    }
    return '<svg class="graphique" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Avance cumulée du modèle et de l’Elo seul sur la référence neutre, semaine par semaine">' +
      '<line class="axe-zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '"></line>' +
      '<text class="axe-txt" x="' + (L - 6) + '" y="' + (Y(0) + 4).toFixed(1) + '" text-anchor="end">0 %</text>' +
      '<text class="axe-txt" x="' + (L - 6) + '" y="' + (Y(max) + 4).toFixed(1) + '" text-anchor="end">' + esc(pc(max, 0)) + '</text>' +
      '<polyline class="courbe-elo" points="' + courbe('e') + '"></polyline>' +
      '<polyline class="courbe-modele" points="' + courbe('m') + '"></polyline>' +
      pts.map(function (p, i) {
        return '<circle class="point-modele" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.m).toFixed(1) + '" r="3.5"></circle>';
      }).join('') +
      '<text class="axe-txt" x="' + L + '" y="' + (H - 10) + '">' + esc(jourCourt(pts[0].lab)) + '</text>' +
      '<text class="axe-txt" x="' + (W - R) + '" y="' + (H - 10) + '" text-anchor="end">' + esc(jourCourt(pts[pts.length - 1].lab)) + '</text>' +
      '</svg>' +
      '<p class="legende-graph"><span class="trait trait-modele"></span> Modèle <span class="trait trait-elo"></span> Elo seul</p>';
  }
  function tableauProgression(semaines) {
    var cumul = 0, lignes = '';
    (semaines || []).forEach(function (s) {
      cumul += s.matchs;
      if (cumul < 100) return;
      lignes += '<tr><td>' + esc(dateFr(s.semaine)) + '</td><td>' + nb(cumul) + '</td><td>' + esc(pc(s.precision_cumulee, 1)) + '</td><td>' +
        esc(pcSigne(s.competence_cumulee)) + '</td><td>' + esc(pcSigne(1 - s.log_loss_elo_cumule / s.log_loss_reference_cumule)) + '</td></tr>';
    });
    return '<div class="scroll"><table><thead><tr><th>Semaine (lundi)</th><th>Matchs joués</th><th>Précision</th><th>Modèle</th><th>Elo seul</th></tr></thead><tbody>' + lignes + '</tbody></table></div>';
  }
  // Prévu contre observé, pour chacune des trois issues
  function calibrationHtml(b) {
    var p = b.resume.prevue, o = b.resume.observee;
    return '<div class="calibration">' + ['H', 'D', 'A'].map(function (c) {
      return '<div class="cal-ligne"><div class="cal-nom">' + esc(NOM_ISSUE[c]) + ' <span class="puce ' + CLASSE_ISSUE[c] + '">' + ETIQ_ISSUE[c] + '</span></div>' +
        '<div class="cal-barre"><span class="label">Prévu</span><span class="cal-fond"><span class="cal-val" style="width:' + (p[c] * 100).toFixed(1) + '%"></span></span><strong>' + esc(pc(p[c], 1)) + '</strong></div>' +
        '<div class="cal-barre"><span class="label">Observé</span><span class="cal-fond"><span class="cal-val ' + CLASSE_ISSUE[c] + '" style="width:' + (o[c] * 100).toFixed(1) + '%"></span></span><strong>' + esc(pc(o[c], 1)) + '</strong></div></div>';
    }).join('') + '</div>';
  }
  function attentionHtml(liste) {
    if (!liste || !liste.length) return '<p class="hint">Aucun écart de calibration au-delà de deux erreurs-types.</p>';
    return '<ul class="list">' + liste.map(function (c) {
      return '<li><strong>' + esc(NOM_ISSUE[c.resultat]) + '</strong> annoncée entre ' + esc(pc(c.de)) + ' et ' + esc(pc(Math.min(c.a, 1))) +
        ' : observée ' + esc(pc(c.observee, 1)) + ', prévue ' + esc(pc(c.prevue, 1)) + ', sur ' + nb(c.matchs) + ' matchs. Le modèle ' +
        (c.observee > c.prevue ? 'sous-estime' : 'surestime') + ' ce résultat à ce niveau de probabilité.</li>';
    }).join('') + '</ul>';
  }
  function listeChampionnats(liste) {
    var max = Math.max.apply(null, liste.map(function (g) { return Math.abs(g.competence); })) || 1;
    return '<div class="championnats">' + liste.map(function (g) {
      return '<div class="championnat"><div class="championnat-top"><strong>' + esc(g.nom) + '</strong><span class="hint">' + nb(g.matchs) + ' matchs</span></div>' +
        '<div class="championnat-bas"><span class="championnat-barre"><span class="championnat-val ' + (g.competence >= 0 ? 'pos' : 'neg') +
        '" style="width:' + (Math.abs(g.competence) / max * 100).toFixed(1) + '%"></span></span>' +
        '<span class="championnat-chiffres">' + esc(pcSigne(g.competence)) + ' · précision ' + esc(pc(g.precision, 1)) + '</span></div></div>';
    }).join('') + '</div>';
  }
  function ecartHtml(e) {
    return '<article class="ecart"><p class="hint">' + esc(dateFr(e.date)) + ' · ' + esc(e.nom_ligue) + '</p>' +
      '<h3 class="ecart-titre">' + esc(e.domicile) + ' – ' + esc(e.exterieur) + '</h3>' +
      '<p class="ecart-issue">Prévu <span class="puce ' + CLASSE_ISSUE[e.prevu] + '">' + esc(e.prevu) + '</span> ' + esc(pc(e.proba_prevue)) +
      ' · réel <span class="puce ' + CLASSE_ISSUE[e.reel] + '">' + esc(e.reel) + '</span> ' + esc(pc(e.proba_reel)) + ' prévu pour ce résultat</p>' +
      '<div class="ecart-bloc"><span class="label">Ce qui poussait vers le prévu</span><ul class="puces">' +

      '<p class="ecart-lecture"><strong>Lecture :</strong> ' + esc(e.lecture) + '</p></article>';
  }
  function previsionsHtml(j) {
    if (!j || !j.enregistrees) return '<p class="hint">Aucune prévision enregistrée pour l’instant. Le journal note la probabilité de chaque match à venir avant son coup d’envoi.</p>';
    var compte = '<div class="kpis kpis3"><div class="kpi"><span class="label">Enregistrées</span><strong>' + j.enregistrees + '</strong></div>' +
      '<div class="kpi"><span class="label">Évaluées</span><strong>' + j.evaluees + '</strong></div>' +
      '<div class="kpi"><span class="label">En attente</span><strong>' + j.en_attente + '</strong></div></div>';
    var liste = (j.entrees || []).map(function (e) {
      var etat = e.juste == null ? '<span class="etat">En attente</span>' : (e.juste ? '<span class="etat ok">Prévu juste</span>' : '<span class="etat bad">Prévu manqué</span>');
      return '<div class="prevision"><div class="prevision-top"><span class="hint">' + esc(dateFr(e.date)) + ' · ' + esc(e.nom_ligue) + '</span>' + etat + '</div>' +
        '<strong class="prevision-match">' + esc(e.domicile) + ' – ' + esc(e.exterieur) + '</strong>' +
        '<p class="prevision-bas">Pronostic <span class="puce ' + CLASSE_ISSUE[e.pronostic] + '">' + esc(e.pronostic) + '</span> · 1 ' + esc(pc(e.proba['1'])) +
        ' · N ' + esc(pc(e.proba['N'])) + ' · 2 ' + esc(pc(e.proba['2'])) + '</p></div>';
    }).join('');
    return compte + liste + (j.evaluees ? '<p class="hint">Précision sur les matchs évalués : ' + esc(pc(j.precision, 1)) + '.</p>' : '');
  }
  function historiqueHtml(liste) {
    if (!liste || !liste.length) return '<p class="hint">Aucun bilan précédent.</p>';
    return '<div class="scroll"><table><thead><tr><th>Données jusqu’au</th><th>Matchs</th><th>Précision</th><th>Log-loss</th><th>Avance</th></tr></thead><tbody>' +
      liste.slice().reverse().map(function (x) {
        return '<tr><td>' + esc(dateFr(x.date_donnees)) + '</td><td>' + nb(x.matchs) + '</td><td>' + esc(pc(x.precision, 1)) + '</td><td>' +

      }).join('') + '</tbody></table></div>';
  }
  function viewBilan() {
    var b = S.bilan;
    if (!b || !b.resume) return zone('neutre', 1, 'Bilan d’observation', '<p class="hint">Le bilan n’est pas encore calculé.</p>');
    var r = b.resume, m = b.meta;
    var vRef = verdictEcart(r.ecart_reference), vElo = verdictEcart(r.ecart_elo);
    var alerte = m.date_donnees !== S.derniere
      ? '<div class="notice">Ce bilan date du ' + esc(dateFr(m.date_donnees)) + ' : il sera recalculé à la prochaine mise à jour.</div>' : '';
    var ecarts = b.ecarts || [];
    var recurrents = b.facteurs_recurrents || { ecarts: 0, items: [] };
    var tags = recurrents.items.map(function (x) { return '<span class="tag">' + esc(x[0]) + ' · ' + x[1] + '</span>'; }).join('');
    var z1 = zone('ok', 1, 'Résultat global',
      '<p class="hint">Saison ' + esc(m.saison_libelle) + ' · ' + nb(r.matchs) + ' matchs évalués sur ' + m.journees + ' journées.</p>' +
      '<p class="hint">' + (m.genere_le ? 'Bilan rédigé le ' + esc(dateFr(m.genere_le)) + ' · ' : '') + 'dernier match pris en compte : ' + esc(dateFr(m.date_donnees)) + '.</p>' + alerte +
      '<div class="kpis">' +
        '<div class="kpi kpi-grand"><span class="label">Précision : le résultat le plus probable s’est réalisé</span><strong>' + esc(pc(r.precision, 1)) + '</strong><span class="hint">Au hasard : 33 %.</span></div>' +
        '<div class="kpi"><span class="label">Erreur du modèle</span><strong>' + fr(r.log_loss, 3) + '</strong><span class="hint">log-loss, plus bas = mieux</span></div>' +
        '<div class="kpi"><span class="label">Référence neutre</span><strong>' + fr(r.log_loss_reference, 3) + '</strong><span class="hint">Elo seul : ' + fr(r.log_loss_elo, 3) + '</span></div>' +
      '</div>' +
      '<div class="verdicts">' +
        '<div class="verdict"><span class="label">Gain contre la référence neutre</span><strong>' + esc(signe(r.ecart_reference.moyenne, 3)) + '</strong><span class="hint">par match · ' + esc(intervalleTxt(r.ecart_reference)) + '</span><span class="etat ' + vRef.tone + '">' + esc(vRef.texte) + '</span></div>' +
        '<div class="verdict"><span class="label">Gain contre l’Elo seul</span><strong>' + esc(signe(r.ecart_elo.moyenne, 3)) + '</strong><span class="hint">par match · ' + esc(intervalleTxt(r.ecart_elo)) + '</span><span class="etat ' + vElo.tone + '">' + esc(vElo.texte) + '</span></div>' +
      '</div>' +
      '<p class="conclusion">' + esc(conclusionBilan(vRef, vElo)) + '</p>' +
      '<p class="hint">Un gain positif signifie que le modèle prévoit mieux. L’intervalle à 95 % indique si l’écart peut venir du hasard.</p>');
    var z2 = zone('info', 2, 'Progression journée après journée',
      '<p class="hint">Avance cumulée sur la référence neutre, à partir de 100 matchs joués. Plus la courbe monte, mieux le modèle prévoit.</p>' +
      graphiqueProgression(progression(b.semaines)) +
      '<details class="more"><summary>Détail par semaine</summary>' + tableauProgression(b.semaines) + '</details>');
    var z3 = zone('warn', 3, 'Calibration : les probabilités annoncées se réalisent-elles ?',
      calibrationHtml(b) + '<h3 class="sous-titre">Points d’attention</h3>' + attentionHtml(b.attention));
    var z4 = zone('info', 4, 'Par championnat',
      '<p class="hint">Avance sur la référence neutre, en pourcentage de log-loss, et part des résultats prévus juste.</p>' + listeChampionnats(b.ligues || []));
    var z5 = zone('warn', 5, 'Écarts marquants',
      (recurrents.items.length ? '<p class="hint">Sur les ' + recurrents.ecarts + ' matchs où le résultat réel était jugé à moins de 25 %, les variables qui ont le plus poussé vers le prévu :</p><div class="chips">' + tags + '</div>' : '') +
      '<p class="hint">Les 15 écarts les plus marqués, avec ce que disent les statistiques du match :</p>' +
      '<div class="ecarts">' + ecarts.slice(0, 5).map(ecartHtml).join('') + '</div>' +
      (ecarts.length > 5 ? '<details class="more"><summary>Voir les ' + (ecarts.length - 5) + ' autres écarts</summary><div class="ecarts">' + ecarts.slice(5).map(ecartHtml).join('') + '</div></details>' : ''));
    var z6 = zone('info', 6, 'Prévisions enregistrées avant match', previsionsHtml(b.journal));
    var z7 = zone('neutre', 7, 'Bilans successifs', historiqueHtml(b.historique || []));
    var z8 = zone('neutre', 8, 'Comment lire ce bilan',
      '<ul class="corps-liste">' +
      '<li>Chaque journée est prédite avec un modèle entraîné uniquement sur les matchs joués avant elle : il ne voit jamais le résultat qu’il prévoit.</li>' +
      '<li>Aucune cote de bookmaker n’est utilisée.</li>' +
      '<li>Un match est un événement à faible signal : une probabilité de 25 % se réalise une fois sur quatre.</li>' +
      '<li>Les explications des écarts (tirs, expulsions) sont des indices, pas des preuves.</li>' +
      '<li>Les coupes d’Europe ne sont pas couvertes : aucune source de résultats n’est branchée pour elles.</li></ul>');
    return z1 + z2 + z3 + z4 + z5 + z6 + z7 + z8;
  }

  // ---------- Thème : clair par défaut ; sombre ou automatique (réglage du téléphone), au choix
  var THEME_KEY = 'lotofoot.theme';
  var THEMES = [['light', 'Clair'], ['dark', 'Sombre'], ['auto', 'Auto']];
  function lireTheme() {
    try {
      var t = window.localStorage.getItem(THEME_KEY);
      return (t === 'dark' || t === 'auto') ? t : 'light';
    } catch (e) { return 'light'; }
  }
  function appliquerTheme(t) {
    if (THEMES.map(function (x) { return x[0]; }).indexOf(t) === -1) t = 'light';
    S.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    try { window.localStorage.setItem(THEME_KEY, t); } catch (e) { /* navigation privée : le choix n’est pas gardé */ }
    // La barre du navigateur, sur téléphone, prend la couleur du fond affiché
    var couleur = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    var meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) { meta = document.createElement('meta'); meta.setAttribute('name', 'theme-color'); document.head.appendChild(meta); }
    if (couleur) meta.setAttribute('content', couleur);
  }
  function reglagesTheme() {
    return '<div class="theme" role="group" aria-label="Affichage">' + THEMES.map(function (t) {
      return '<button type="button" class="theme-choix" data-theme-choix="' + t[0] + '" aria-pressed="' + (S.theme === t[0]) + '">' + t[1] + '</button>';
    }).join('') + '</div>';
  }

  // ---------- Recherche : un match quelconque, tapé par équipes, calculé comme l’onglet Match
  var RECH_NIVEAUX = [['dominant', 'Club dominant de son championnat'], ['haut', 'Club du haut de tableau'], ['milieu', 'Club du milieu de tableau']];
  function noteSaisie(texte) {
    var n = parseFloat(String(texte == null ? '' : texte).replace(',', '.'));
    return (isNaN(n) || n < 0 || n > 100) ? null : n;
  }
  // Elo estimé d’un club hors des données, selon son niveau dans son championnat (mêmes formules que les clubs hypothétiques)
  function eloLibre(note, niveau) {
    var dominant = 1668 + 2.4 * note, moyen = 1512 + 0.96 * note;
    return Math.round(niveau === 'dominant' ? dominant : (niveau === 'haut' ? (dominant + moyen) / 2 : moyen));
  }
  // Club hors des données : championnat et niveau saisis, statistiques moyennes (comme les clubs hypothétiques)
  function equipeLibre(texte, championnat, note, niveau, code) {
    CHAMPIONNATS_HYPOTHESE[code] = { pays: championnat || 'Championnat saisi', note: note };
    var vec = {}, moyen = vecMoyen();
    Object.keys(moyen).forEach(function (k) { vec[k] = moyen[k]; });
    vec.elo = eloLibre(note, niveau);
    return {
      ligue: code, pays: championnat || 'Championnat saisi',
      ligue_nom: (championnat || 'Championnat saisi') + ' (hypothèse)',
      equipe: texte.trim(), vec: vec, hypothese: true, niveau: niveau,
      motif: 'club saisi par vous, hors des 16 championnats suivis : son niveau et son championnat sont des estimations.'
    };
  }
  // L’équipe telle qu’elle est calculée : nos données, un club hypothétique connu, ou un club saisi
  // (ecart : variation de la note du championnat, pour la sensibilité)
  function equipeRecherche(cote, ecart) {
    var s = S.rech[cote];
    var t = trouverEquipe(s.texte);
    if (t) return t;
    var note = noteSaisie(s.note);
    if (note === null) return null;
    note = Math.max(0, Math.min(100, note + (ecart || 0)));
    return equipeLibre(s.texte, s.championnat, note, s.niveau, 'LIBRE_' + cote + (ecart < 0 ? 'm' : (ecart > 0 ? 'p' : '')));
  }
  function lienRecherche(s) {
    return 'https://duckduckgo.com/?q=' + encodeURIComponent(s.texte.trim() + ' ' + (s.championnat || '') + ' championnat classement');
  }
  function repereNotes() {
    var ns = ((S.stats && S.stats.notes) || []).slice().sort(function (a, b) { return b.note - a.note; });
    return ns.map(function (n) { return n.nom + ' ' + String(n.note).replace('.', ','); }).join(' · ');
  }
  function datalistEquipes() {
    var equipes = S.equipes.slice().sort(function (a, b) { return (a.ligue_nom + ' ' + a.equipe).localeCompare(b.ligue_nom + ' ' + b.equipe); })
      .map(function (t) { return '<option value="' + esc(t.equipe) + '">' + esc(t.ligue_nom) + '</option>'; });
    var hyp = Object.keys(CLUBS_HYPOTHESE).map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(CHAMPIONNATS_HYPOTHESE[CLUBS_HYPOTHESE[n].ligue].pays) + ' (hypothèse)</option>';
    });
    return equipes.concat(hyp).join('');
  }
  // Un champ d’équipe ; sous lui, les champs du club hors des données (championnat, note, niveau, recherche)
  function champRecherche(cote, libelle) {
    var s = S.rech[cote];
    return '<div class="rech-cote"><div class="field"><label for="rech-' + cote + '">' + libelle + '</label>' +
      '<input id="rech-' + cote + '" class="txtin" type="text" list="liste-recherche" autocomplete="off" data-rech="' + cote + '" value="' + esc(s.texte) + '" placeholder="Ex. Sporting, Shakhtar Donetsk"></div>' +
      '<div id="rech-libre-' + cote + '">' + libreHtml(cote) + '</div></div>';
  }
  function libreHtml(cote) {
    var s = S.rech[cote];
    if (!s.texte.trim()) return '';
    var trouvee = trouverEquipe(s.texte);
    if (trouvee) return '<p class="hint">Reconnue dans nos données : ' + esc(trouvee.ligue_nom) + '.</p>';
    return '<div class="libre"><p class="libre-titre">Équipe hors de nos données</p>' +
      '<p class="hint">Indiquez son championnat et son niveau. Le bouton ouvre une recherche sur Internet pour les trouver.</p>' +
      '<div class="rech-champs">' +
        '<div class="field"><label for="rech-champ-' + cote + '">Championnat</label><input id="rech-champ-' + cote + '" class="txtin" type="text" data-rech-champ="' + cote + '" value="' + esc(s.championnat) + '" placeholder="Ex. Ukraine"></div>' +
        '<div class="field"><label for="rech-note-' + cote + '">Note du championnat, sur 100</label><input id="rech-note-' + cote + '" class="txtin" type="text" inputmode="decimal" data-rech-note="' + cote + '" value="' + esc(s.note) + '" placeholder="Ex. 42,5"></div>' +
        '<div class="field"><label for="rech-niveau-' + cote + '">Niveau du club dans son championnat</label><select id="rech-niveau-' + cote + '" data-rech-niveau="' + cote + '">' +
          RECH_NIVEAUX.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === s.niveau ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<div class="btns"><a id="rech-lien-' + cote + '" class="btn" href="' + lienRecherche(s) + '" target="_blank" rel="noopener">Chercher sur Internet</a></div>' +
      '</div>';
  }
  // Saisie : seule la zone concernée est mise à jour, pour ne pas perdre le champ où l’on écrit
  function rechercheSaisie(el, cote, quoi) {
    var s = S.rech[cote];
    if (!s) return;
    if (quoi === 'texte') {
      s.texte = el.value;
      var zoneLibre = document.getElementById('rech-libre-' + cote);
      if (zoneLibre) zoneLibre.innerHTML = libreHtml(cote);
    } else if (quoi === 'champ') {
      s.championnat = el.value;
      var lien = document.getElementById('rech-lien-' + cote);
      if (lien) lien.setAttribute('href', lienRecherche(s));
    } else if (quoi === 'note') {
      s.note = el.value;
    } else if (quoi === 'niveau') {
      s.niveau = el.value;
    }
    var resultat = document.getElementById('rech-resultat');
    if (resultat) resultat.innerHTML = resultatRecherche();
  }
  // Même présentation que l’onglet Match : trois probabilités, favori, barre, détail des équipes de nos données
  // ---------- Pourquoi ce pronostic : chaque groupe de variables du modèle pèse pour ou contre le favori.
  // Contribution d’une variable = (coefficient de l’issue − coefficient moyen des trois issues) × valeur centrée réduite.
  var GROUPES_RAISON = [
    { cle: 'elo', indices: [0] },
    { cle: 'forme', indices: [7, 8] },
    { cle: 'attaque', indices: [9, 11] },
    { cle: 'defense', indices: [10, 12] },
    { cle: 'tirs', indices: [17, 19] },
    { cle: 'tirsConcedes', indices: [18, 20] },
    { cle: 'repos', indices: [13, 14] },
    { cle: 'charge', indices: [15, 16] }
  ];
  function phraseRaison(cle, h, a, f, x) {
    var own = f === 'H' ? h : a, opp = f === 'H' ? a : h;
    if (cle === 'elo') {
      var e = Math.round(Math.abs(x[0]) * 100);
      return (f === 'H') === (x[0] > 0) && e > 0 ? 'niveau supérieur (+' + e + ' points)' : null;
    }
    if (cle === 'forme') return own.forme > opp.forme ? 'meilleure forme récente (' + fr(own.forme, 1) + ' contre ' + fr(opp.forme, 1) + ' points par match)' : null;
    if (cle === 'attaque') return own.gf > opp.gf ? 'attaque plus prolifique (' + fr(own.gf, 1) + ' contre ' + fr(opp.gf, 1) + ' buts par match)' : null;
    if (cle === 'defense') return own.ga < opp.ga ? 'défense plus solide (' + fr(own.ga, 1) + ' contre ' + fr(opp.ga, 1) + ' buts encaissés par match)' : null;
    if (cle === 'tirs') return own.cadF > opp.cadF ? 'plus de tirs cadrés (' + fr(own.cadF, 1) + ' contre ' + fr(opp.cadF, 1) + ' par match)' : null;
    if (cle === 'tirsConcedes') return own.cadA < opp.cadA ? 'moins de tirs cadrés concédés (' + fr(own.cadA, 1) + ' contre ' + fr(opp.cadA, 1) + ' par match)' : null;
    if (cle === 'repos') return own.rest > opp.rest ? 'plus de repos (' + Math.round(own.rest) + ' contre ' + Math.round(opp.rest) + ' jours)' : null;
    if (cle === 'charge') return own.load < opp.load ? 'moins de matchs ces 30 derniers jours (' + Math.round(own.load) + ' contre ' + Math.round(opp.load) + ')' : null;
    return null;
  }
  function pourquoiMatch(h, a, r, best) {
    var p = r.p, M = S.modele, x = vecteurX(r.hv, r.av, r.gap);
    if (best === 'D') {
      return 'Match nul le plus probable (' + pc(p.D) + ') : niveaux proches (écart Elo de ' + Math.round(Math.abs(x[0]) * 100) +
        ' points) et formes comparables (' + fr(r.hv.forme, 1) + ' contre ' + fr(r.av.forme, 1) + ' points par match).';
    }
    var f = best, nom = esc(f === 'H' ? h.equipe : a.equipe);
    var zj = x.map(function (v, j) { return (v - M.moyenne[j]) / M.echelle[j]; });
    var groupes = GROUPES_RAISON.map(function (g) {
      var net = g.indices.reduce(function (s, j) {
        var moy = (M.coef.H[j] + M.coef.D[j] + M.coef.A[j]) / 3;
        return s + (M.coef[f][j] - moy) * zj[j];
      }, 0);
      return { cle: g.cle, net: net };
    }).filter(function (g) { return g.net > 0.02; }).sort(function (u, v) { return v.net - u.net; });
    var phrases = [];
    groupes.forEach(function (g) {
      var t = phrases.length < 2 ? phraseRaison(g.cle, r.hv, r.av, f, x) : null;
      if (t) phrases.push(t);
    });
    var raisons = phrases.length ? phrases.join(' et ') : 'l’ensemble des statistiques penche légèrement de son côté';
    if (p[f] >= 0.5) return 'Nous pensons que <strong>' + nom + '</strong> va gagner (' + pc(p[f]) + ') : ' + raisons + '.';
    return '<strong>' + nom + '</strong> est le plus probable à gagner, sans favori net (' + pc(p[f]) + ') : ' + raisons + '.';
  }
  // Issue la plus probable, avec les mêmes règles d’égalité que l’onglet Match
  function issueFavorite(p) {
    if (p.D >= p.H && p.D >= p.A) return 'D';
    return (p.A > p.H && p.A >= p.D) ? 'A' : 'H';
  }
  // Phrase en texte simple, pour les matchs d’une grille (enregistrée avec la grille)
  function texteRaison(h, a, r) {
    return pourquoiMatch(h, a, r, issueFavorite(r.p)).replace(/<\/?strong>/g, '');
  }
  function resultatMatch(h, a) {
    if (!h || !a) return note('Données indisponibles pour ces équipes.');
    if (h.equipe === a.equipe) return note('Choisis deux équipes différentes.');
    var r = calculMatch(h, a);
    if (r.erreur) return note(r.erreur);
    var p = r.p, best = 'H';
    if (p.D >= p.H && p.D >= p.A) best = 'D';
    else if (p.A > p.H && p.A >= p.D) best = 'A';
    var favTxt = pourquoiMatch(h, a, r, best);
    var avert = r.cross
      ? '<div class="notice"><strong>Estimation très approximative.</strong> Notes des championnats : ' + esc(h.ligue_nom) + ' ' + String(r.nh).replace('.', ',') + '/100 et ' + esc(a.ligue_nom) + ' ' + String(r.na).replace('.', ',') + '/100, soit un écart de ' + String(r.gap).replace('-', '−') + ' points Elo. Les statistiques de l’équipe du championnat le plus faible sont ramenées à l’échelle du plus fort. Ce calcul entre championnats n’a jamais été testé : les notes sont une estimation.</div>'
      : '';
    var hypo = [h, a].filter(function (t) { return t.hypothese; }).map(function (t) {
      return '<p class="hint">Hypothèse : ' + esc(texteHypothese(t)) + '</p>';
    }).join('');
    var details = (h.hypothese || a.hypothese) ? '' :
      '<details class="more" open><summary>Statistiques des deux équipes</summary>' + duelTable(h, a) + '</details>';
    return '<span class="label">' + (r.cross ? esc(h.ligue_nom) + ' contre ' + esc(a.ligue_nom) : esc(h.ligue_nom)) + '</span>' +
      '<h3 class="match-titre">' + esc(h.equipe) + ' – ' + esc(a.equipe) + '</h3>' +
      '<div class="kpis kpis3">' +
        '<div class="kpi k1' + (best === 'H' ? ' is-fav' : '') + '"><span class="label">Victoire ' + esc(h.equipe) + '</span><strong>' + pc(p.H) + '</strong></div>' +
        '<div class="kpi kN' + (best === 'D' ? ' is-fav' : '') + '"><span class="label">Match nul</span><strong>' + pc(p.D) + '</strong></div>' +
        '<div class="kpi k2' + (best === 'A' ? ' is-fav' : '') + '"><span class="label">Victoire ' + esc(a.equipe) + '</span><strong>' + pc(p.A) + '</strong></div>' +
      '</div>' +
      barreHtml(p.H, p.D, p.A) +
      '<p class="raison">' + favTxt + '</p>' +
      '<p class="hint">Statistiques seules, sans cotes. Ce calcul ne garantit rien.</p>' +
      alertesHtml(alertesAbsences(h, a)) + avert + hypo + details;
  }
  // Sensibilité : le niveau des championnats saisis vaut 5 points de plus ou de moins
  function sensibiliteRecherche() {
    var r = S.rech;
    if (trouverEquipe(r.dom.texte) && trouverEquipe(r.ext.texte)) return '';
    var resultats = [-5, 0, 5].map(function (ecart) {
      var c = calculMatch(equipeRecherche('dom', ecart), equipeRecherche('ext', ecart));
      return c.erreur ? null : c.p;
    }).filter(function (p) { return p; });
    if (resultats.length < 3) return '';
    function plage(k) {
      var v = resultats.map(function (p) { return p[k]; });
      return pc(Math.min.apply(null, v)) + ' à ' + pc(Math.max.apply(null, v));
    }
    return '<p class="hint">Sensibilité : si le niveau du ou des championnats saisis vaut 5 points de plus ou de moins, ' +
      '1 : ' + plage('H') + ' · N : ' + plage('D') + ' · 2 : ' + plage('A') + '.</p>';
  }
  function resultatRecherche() {
    var r = S.rech;
    if (!r.dom.texte.trim() || !r.ext.texte.trim()) return note('Tapez les deux équipes : les probabilités s’affichent ensuite.');
    var manquantes = ['dom', 'ext'].filter(function (c) {
      return !trouverEquipe(r[c].texte) && noteSaisie(r[c].note) === null;
    }).map(function (c) { return r[c].texte.trim(); });
    if (manquantes.length) return note('Indiquez la note du championnat de ' + manquantes.join(' et ') + ' pour calculer.');
    return resultatMatch(equipeRecherche('dom', 0), equipeRecherche('ext', 0)) + sensibiliteRecherche();
  }
  function viewRecherche() {
    if (!S.equipes.length) return note('Les équipes ne sont pas encore enregistrées.');
    return zone('info', 1, 'Chercher un match',
        '<p class="hint">Tapez les deux équipes, comme pour une grille. Une équipe de nos 16 championnats est reconnue tout de suite. Une équipe d’un autre championnat se calcule par hypothèse, avec le niveau que vous indiquez.</p>' +
        '<div class="rech-grille">' + champRecherche('dom', 'Équipe à domicile (reçoit)') + champRecherche('ext', 'Équipe à l’extérieur') + '</div>' +
        '<details class="more"><summary>Repères : notes des 16 championnats sur 100</summary><p class="hint">' + esc(repereNotes()) + '</p></details>' +
        '<datalist id="liste-recherche">' + datalistEquipes() + '</datalist>') +
      zone('ok', 2, 'Probabilités', '<div id="rech-resultat">' + resultatRecherche() + '</div>');
  }

  // ---------- Résultats : uniquement les matchs des grilles Loto Foot (données : resultats.json)

        return '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line)">' +
          '<span style="flex:1;text-align:right">' + esc(m.domicile) + '</span>' +
          '<strong style="min-width:52px;text-align:center">' + esc(m.score) + '</strong>' +
          '<span style="flex:1">' + esc(m.exterieur) + '</span></div>';
      }).join('');
      return '<section style="margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)">' +
        '<p class="hint" style="margin:0 0 6px"><strong>Loto Foot ' + esc(g.format) + ' · grille N°' + esc(g.numero) + '</strong> · relevé le ' + esc(dateFr(g.releve)) + '</p>' +
        lignes + '</section>';
    }).join('') + '<p class="hint">Ces grilles n’avaient pas de prévision enregistrée : seuls les résultats sont affichés.</p>';
  }
  // Grilles masquées sur cet appareil (confort d’affichage : les grilles restent enregistrées)
  var CLE_MASQUEES = 'lotofoot.masquees.v1';
  function lireMasquees() {
    try { var v = JSON.parse(window.localStorage.getItem(CLE_MASQUEES) || '[]'); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function masquerGrille(cle) {
    var liste = lireMasquees();
    if (liste.indexOf(cle) === -1) liste.push(cle);
    try { window.localStorage.setItem(CLE_MASQUEES, JSON.stringify(liste)); } catch (e) { /* stockage indisponible : la grille reste affichée */ }
  }
  function reafficherGrilles() {
    try { window.localStorage.removeItem(CLE_MASQUEES); } catch (e) { /* rien à réafficher */ }
  }
  function viewResultats() {
    var r = S.resultats;
    var mes = zone('ok', 1, 'Mes grilles : mon bilan par grille', contenuMesGrilles(resultatsPublies()));
    if (!r) return mes + note('Les résultats des grilles publiées ne sont pas encore disponibles.');
    var masquees = lireMasquees();
    var visibles = r.grilles.filter(function (g) { return masquees.indexOf(g.format + '|' + g.numero) === -1; });
    var grilles = visibles.length ? ordreResultats(visibles, function (g) { return g.cloture; }).map(grilleResultats).join('') : note('Aucune grille suivie à afficher.');
    var nMasquees = r.grilles.length - visibles.length;
    if (nMasquees) grilles += '<p class="hint">' + nMasquees + ' grille(s) masquée(s) sur cet appareil. <button type="button" class="btn ghost petit" data-act="reafficher-grilles">Les réafficher</button></p>';
    return mes +
      zone('neutre', 2, 'Grilles suivies par le modèle : bilan par grille', grilles) +
      (r.releves && r.releves.length ? zone('neutre', 3, 'Autres grilles relevées : résultats seulement', relevesHtml(r.releves)) : '') +
      zone('info', 4, 'Bilan cumulé de toutes les grilles (pour information)', '<details><summary class="hint">Afficher le bilan cumulé</summary>' + bilanResultats(r.bilan) + legendeResultats() + '</details>') +
      '<p class="hint">Mis à jour le ' + esc(dateFr(r.maj.slice(0, 10))) + '. « Mes grilles » reprend tes grilles enregistrées sur cet appareil. Les pronostics du modèle sont calculés sans ton jeu. Aucune cote de bookmaker.</p>';
  }
  // ---------- Cadre : onglets, en-tête, pied
  function panel() {
    if (S.tab === 'grille') return viewGrille();
    if (S.tab === 'resultats') return viewResultats();
    if (S.tab === 'match') return viewMatch();
    if (S.tab === 'recherche') return viewRecherche();
    if (S.tab === 'stats') return viewStats();
    if (S.tab === 'bilan') return viewBilan();
    return viewMethode();
  }
  function render() {
    verrouillerEchues();
    var tabs = '<nav class="tabs" role="tablist" aria-label="Sections">' + TABS.map(function (t) {
      return '<button type="button" role="tab" id="tab-' + t[0] + '" aria-selected="' + (S.tab === t[0]) +
        '" data-tab="' + t[0] + '">' + ICONES[t[0]] + '<span>' + t[1] + '</span></button>';
    }).join('') + '</nav>';
    app.innerHTML = '<div class="page">' +
      '<header class="head"><div class="marque">' + LOGO + '<div><h1>Lotofoot</h1>' +
      '<p class="accroche">Pronostics par statistiques · aucune cote de bookmaker</p></div></div>' + '<div class="head-barre">' + etatDonnees() + reglagesTheme() + '</div></header>' +
      suiviBanniere() + tabs +
      '<main class="contenu" role="tabpanel" aria-labelledby="tab-' + S.tab + '">' + panel() + '</main>' +
      '<footer class="pied"><p class="foot-note">Sources : football-data.co.uk (résultats et statistiques de match). ' + esc(fraicheurDonnees()) + '. ' + esc(S.miseAJour) + '</p></footer>' +
      '</div>';
  }
  function agir(action, el) {
    if (action !== 'copier') S.texteCopie = '';
    if (action === 'nouvelle') { S.nouvelle = true; S.form = formVide(); S.message = ''; }
    else if (action === 'annuler') { S.nouvelle = false; S.form = null; }
    else if (action === 'enregistrer') { enregistrerApercu(el.getAttribute('data-lock') === '1'); }
    else if (action === 'preference') { appliquerPreference(); }
    else if (action === 'csv') {
      var gc = courante();
      if (gc) {
        var mode = enregistrerFichier(nomFichier(gc.nom, '') + '.csv', csvGrille(gc, resultatGrille(gc)), 'text/csv;charset=utf-8', gc.nom);
        S.message = mode === 'partage' ? '' : 'Grille téléchargée au format CSV.';
      }
    }
    else if (action === 'copier') { copierGrille(courante()); }
    else if (action === 'charger-grille') { chargerGrille(); }
    else if (action === 'masquer-grille') { masquerGrille(el.getAttribute('data-cle')); render(); }
    else if (action === 'reafficher-grilles') { reafficherGrilles(); render(); }
    else if (action === 'mettre-a-jour') { mettreAJour(); }
    else if (action === 'recharger') { window.location.reload(); }
    else if (action === 'verrouiller') {
      if (window.confirm('Verrouiller cette grille ? Ses probabilités ne changeront plus.')) verrouiller(S.grilleId);
    }
    else if (action === 'supprimer') {
      if (window.confirm('Supprimer cette grille ? Cette action est définitive.')) supprimer(S.grilleId);
    }
    else if (action === 'supprimer-grille') {
      var gDel = S.grilles[indexGrille(el.getAttribute('data-id'))];
      if (gDel && window.confirm('Supprimer la grille « ' + gDel.nom + ' » ? Cette action est définitive.')) supprimer(gDel.id);
    }
    else if (action === 'sauvegarder') { sauvegarder(); }
    render();
  }
  app.addEventListener('click', function (e) {
    var bcase = e.target.closest && e.target.closest('[data-case]');
    if (bcase) { basculerCase(bcase.getAttribute('data-case'), bcase.getAttribute('data-lettre')); majEuropeTout(); return; }
    var bval = e.target.closest && e.target.closest('[data-valider]');
    if (bval) { validerChoix(bval.getAttribute('data-valider')); rendreEnGardantEurope(); return; }
    var bc = e.target.closest && e.target.closest('[data-contre]');
    if (bc) { basculerContre(bc.getAttribute('data-contre'), bc.getAttribute('data-choix')); rendreEnGardantEurope(); return; }
    if (e.target.closest && (e.target.closest('.europe-details') || e.target.closest('.eu-zone'))) return;
    var th = e.target.closest('[data-theme-choix]');
    if (th) { appliquerTheme(th.getAttribute('data-theme-choix')); render(); return; }
    var t = e.target.closest('[data-tab]');
    if (t) { S.tab = t.getAttribute('data-tab'); S.message = ''; S.texteCopie = ''; render(); return; }
    var g = e.target.closest('[data-grille]');
    if (g) { S.grilleId = g.getAttribute('data-grille'); S.message = ''; S.texteCopie = ''; render(); return; }
    var b = e.target.closest('[data-act]');
    if (b) { agir(b.getAttribute('data-act'), b); return; }
    var st = e.target.closest('[data-set]');
    if (st) {
      var which = st.getAttribute('data-set'), key = st.getAttribute('data-team');
      if (which === 'dom') S.dom = key; else S.ext = key;
      render(); return;
    }
    var cl = e.target.closest('[data-clear]');
    if (cl) {
      if (cl.getAttribute('data-clear') === 'dom') S.dom = ''; else S.ext = '';
      render(); return;
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target.closest && e.target.closest('.europe-details')) return;
    var el = e.target;
    var rc = el.getAttribute('data-rech'), rch = el.getAttribute('data-rech-champ'), rn = el.getAttribute('data-rech-note');
    if (rc || rch || rn) {
      if (rc) rechercheSaisie(el, rc, 'texte'); else if (rch) rechercheSaisie(el, rch, 'champ'); else rechercheSaisie(el, rn, 'note');
      return;
    }
    var champ = el.getAttribute('data-champ');
    if (champ && S.form) {
      S.form.rows[Number(el.getAttribute('data-i'))][champ] = el.value;
      S.form.preference = null;
      S.form.source = null; S.form.choix = null;
      majApercu();
      return;
    }
    if (el.id === 'nom-grille' && S.form) { S.form.nom = el.value; majApercu(); return; }
    if (el.id === 'validite' && S.form) { S.form.validite = el.value; return; }
    if (el.id === 'q') {
      S.q = el.value;
      var box = document.getElementById('match-table');
      if (box) box.innerHTML = tableHtml();
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.closest && e.target.closest('.europe-details')) { enregistrerEurope(e.target); majEuropeTout(); return; }
    var el = e.target;
    if (el.getAttribute('data-rech-niveau')) { rechercheSaisie(el, el.getAttribute('data-rech-niveau'), 'niveau'); return; }
    if (el.id === 'sel-ligue') { S.ligue = el.value; S.equipe = ''; render(); }
    else if (el.id === 'sel-equipe') { S.equipe = el.value; render(); }
    else if (el.id === 'format-n' && S.form) { if (changerFormat(Number(el.value))) chargerGrille(); render(); }
    else if (el.id === 'choix-grille' && S.form) { var choisie = (S.form.choix || []).filter(function (x) { return String(x.numero) === el.value; })[0]; if (choisie) { appliquerGrillePubliee(choisie); appliquerPreference(); } render(); }
    else if (el.id === 'doubles-n' && S.form) { S.form.doubles = Number(el.value); S.form.preference = null; majApercu(); }
    else if (el.id === 'triples-n' && S.form) { S.form.triples = Number(el.value); S.form.preference = null; majApercu(); }
    else if (el.id === 'fichier-csv' && S.form) {
      lireFichier(el.files && el.files[0], function (texte) { appliquerCsv(texte); render(); });
    }
    else if (el.id === 'fichier-restaurer') {
      lireFichier(el.files && el.files[0], function (texte) { restaurer(texte); render(); });
    }
  });

  initGrilles();
  miseAJourSuivi();
  S.miseAJour = /^https?:$/.test(location.protocol) ? '' : 'Version fichier : pas de mise à jour automatique.';
  appliquerTheme(lireTheme());
  render();
  verifierMiseAJour().then(verifierGrillesPubliees).then(function () { render(); });
})();
</script>
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
