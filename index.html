<title>Lotofoot Analyse</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ee; --surface: #ffffff; --fg: #17201b; --muted: #5d6a63; --line: #dad8cf;
  --accent: #1d6a48; --accent-fg: #ffffff; --accent-soft: #dcebe3;
  --warn: #7a4f00; --warn-soft: #f5e9cf; --bad: #9b2c2c; --bad-soft: #f6e0e0;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --surface: #171d1a; --fg: #eceee9; --muted: #9ca79f; --line: #2b3431;
    --accent: #6cc297; --accent-fg: #0b150f; --accent-soft: #1c3a2a;
    --warn: #ebc17a; --warn-soft: #3a2c12; --bad: #f09a9a; --bad-soft: #3a1c1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171d1a; --fg: #eceee9; --muted: #9ca79f; --line: #2b3431;
  --accent: #6cc297; --accent-fg: #0b150f; --accent-soft: #1c3a2a;
  --warn: #ebc17a; --warn-soft: #3a2c12; --bad: #f09a9a; --bad-soft: #3a1c1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
#app { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin-top: 18px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--sans); padding: 9px 2px; border-radius: 9px; cursor: pointer; min-width: 0; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
.label { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.hint { font-size: 13px; color: var(--muted); text-wrap: pretty; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 10px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.kpi strong { display: block; margin-top: 4px; font: 500 20px var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .kname { display: block; margin-top: 4px; font: 600 16px var(--sans); overflow-wrap: anywhere; }
.kpi.is-fav { border-color: var(--accent); background: var(--accent-soft); }
.kpis3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis3 .kpi strong { font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 13px var(--sans); padding: 6px 10px; border-radius: 999px; cursor: pointer; max-width: 100%; text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
select, .txtin { width: 100%; font: 500 15px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 6px; }
.field + .field { margin-top: 12px; }
.field label { font-size: 13px; color: var(--muted); }
.pick { font: 500 13px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 36px; }
.pick.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.match { padding: 12px 0; border-top: 1px solid var(--line); }
.match:first-of-type { border-top: 0; padding-top: 0; }
.match .top { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.match .num { font: 500 13px var(--mono); color: var(--muted); min-width: 24px; }
.match .teams { font-weight: 500; overflow-wrap: anywhere; }
.match .lg { font-size: 12px; color: var(--muted); }
.probs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.prob { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: center; font: 500 15px var(--mono); font-variant-numeric: tabular-nums; }
.prob span { display: block; font: 500 11px var(--sans); color: var(--muted); }
.prob.is-pick { background: var(--accent-soft); border-color: var(--accent); }
.match .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
.match .foot strong { color: var(--fg); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.scroll { overflow-x: auto; max-width: 100%; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th { font: 500 12px var(--sans); color: var(--muted); }
th:first-child, td:first-child { text-align: left; font-family: var(--sans); white-space: normal; }
td.txt, th.txt { font-family: var(--mono); }
.list { margin: 10px 0 0; padding: 0; list-style: none; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.list li:first-child { border-top: 0; }
.list.err li { color: var(--bad); }
.method h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; }
.method h3:first-child { margin-top: 0; }
.method ul { margin: 0; padding-left: 18px; }
.method li { margin-bottom: 6px; }
.foot-note { margin-top: 18px; font-size: 12px; color: var(--muted); text-wrap: pretty; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; font: 600 14px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--bad); }
.status { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.status.lock { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.rowform { display: grid; grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; margin-top: 8px; }
.rowform .num { font: 500 13px var(--mono); color: var(--muted); }
.rowform .txtin { margin-top: 0; }
.rowform .err { grid-column: 2 / 4; font-size: 13px; color: var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 14px; }
</style>

    if (p == null || isNaN(p)) return 'incomplète';
    if (p < 0.001) return 'moins de 0,1 %';
    return fr(p * 100, 2) + ' %';
  }
  function bilan(b) { return b ? (b.V + ' V · ' + b.N + ' N · ' + b.D + ' D sur ' + b.n) : '—'; }
  function bilanCourt(b) { return b ? ('V ' + b.V + ' · N ' + b.N + ' · D ' + b.D) : '—'; }
  function note(t) { return '<section class="card"><p>' + esc(t) + '</p></section>'; }
  function sortedGrilles() {
    return S.grilles.slice().sort(function (a, b) { return String(b.creee || '').localeCompare(String(a.creee || '')); });
  }
  function indexGrille(id) {
    for (var i = 0; i < S.grilles.length; i++) { if (S.grilles[i].id === id) return i; }
    return -1;
  }
  function courante() {
    var gs = sortedGrilles();
    return gs.filter(function (x) { return x.id === S.grilleId; })[0] || gs[0] || null;
  }
  function findTeam(key) {
    var parts = String(key || '').split('|');
    for (var i = 0; i < S.equipes.length; i++) {
      if (S.equipes[i].ligue === parts[0] && S.equipes[i].equipe === parts.slice(1).join('|')) return S.equipes[i];
    }
    return null;
  }
  function trouverEquipe(nom) {
    var k = cle(nom);
    if (!k) return null;
    var cibles = [k];
    if (ALIAS[k]) cibles.push(cle(ALIAS[k]));
    for (var c = 0; c < cibles.length; c++) {
      for (var i = 0; i < S.equipes.length; i++) {
        if (cle(S.equipes[i].equipe) === cibles[c]) return S.equipes[i];
      }
    }
    return null;
  }
  function profilDe(t) {
    var o = {};
    Object.keys(t).forEach(function (k) { if (k !== 'vec') o[k] = t[k]; });
    return o;
  }
  function typeDe(pronostic) {
    return pronostic.length === 3 ? 'Triple' : (pronostic.length === 2 ? 'Double' : 'Simple');
  }
  // Format d’une grille : 7, 8 ou 15 matchs (8 pour les grilles enregistrées avant ce choix)
  function formatDe(g) {
    var n = g ? Number(g.format) : NaN;
    if (FORMATS.indexOf(n) !== -1) return n;
    return (g && g.paires && FORMATS.indexOf(g.paires.length) !== -1) ? g.paires.length : FORMAT_DEFAUT;
  }
  function prixDe(matchs) {
    return matchs.reduce(function (p, m) {
      var t = typeDe(m.pronostic);
      return p * (t === 'Triple' ? 3 : (t === 'Double' ? 2 : 1));
    }, 1);
  }

  // ---------- Moteur : même méthode que l’onglet Match et que grille_v8.py
  function probMatch(h, a, gap) {
    var M = S.modele;
    var x = [h.dW, h.dD, h.dL, a.eW, a.eD, a.eL, h.forme, a.forme,
             h.gf, h.ga, a.gf, a.ga, h.rest, a.rest, h.load, a.load,
             h.cadF, h.cadA, a.cadF, a.cadA, h.cor, a.cor, h.car, a.car];
    x.unshift((h.elo - a.elo + gap) / 100);
    var z = {};
    ['H', 'D', 'A'].forEach(function (c) {
      var s = M.ordonnee[c];
      for (var j = 0; j < x.length; j++) { s += M.coef[c][j] * ((x[j] - M.moyenne[j]) / M.echelle[j]); }
      z[c] = s;
    });
    var mx = Math.max(z.H, z.D, z.A);
    var eH = Math.exp(z.H - mx), eD = Math.exp(z.D - mx), eA = Math.exp(z.A - mx);
    var t = eH + eD + eA;
    return { H: eH / t, D: eD / t, A: eA / t };
  }
  function noteDe(code) {
    var ns = (S.stats && S.stats.notes) || [];
    for (var i = 0; i < ns.length; i++) { if (ns[i].code === code) return ns[i].note; }
    return null;
  }
  // Niveau des championnats : pour deux équipes de championnats différents, les statistiques de
  // l’équipe du championnat le plus faible sont ramenées à l’échelle du plus fort.
  var NIVEAU_VARS = ['dW', 'dD', 'dL', 'eW', 'eD', 'eL', 'forme', 'gf', 'ga', 'cadF', 'cadA', 'cor', 'car'];
  function moyenneDe(teams) {
    var out = {};
    NIVEAU_VARS.forEach(function (k) {
      var s = 0, n = 0;
      teams.forEach(function (t) { if (t.vec && typeof t.vec[k] === 'number') { s += t.vec[k]; n++; } });
      out[k] = n ? s / n : 0;
    });
    return out;
  }
  function moyenneChampionnat(code) {
    var ts = S.equipes.filter(function (t) { return t.ligue === code; });
    return moyenneDe(ts.length ? ts : S.equipes);
  }
  function niveauAjuste(vec, ownCode, oppCode) {
    var out = {};
    Object.keys(vec).forEach(function (k) { out[k] = vec[k]; });
    if (!ownCode || !oppCode || ownCode === oppCode) return out;
    var nOwn = noteDe(ownCode), nOpp = noteDe(oppCode);
    if (nOwn == null || nOpp == null || nOwn >= nOpp) return out;
    var ratio = nOwn / nOpp;
    var muStrong = moyenneChampionnat(oppCode), muWeak = moyenneChampionnat(ownCode);
    NIVEAU_VARS.forEach(function (f) { out[f] = muStrong[f] + ratio * (vec[f] - muWeak[f]); });
    return out;
  }
  function calculMatch(h, a) {
    if (!h.vec || !a.vec || !S.modele) return { erreur: 'Données indisponibles pour cette équipe.' };
    var cross = h.ligue !== a.ligue, gap = 0, nh = null, na = null;
    if (cross) {
      nh = noteDe(h.ligue); na = noteDe(a.ligue);
      if (nh == null || na == null) return { erreur: 'il manque une note de championnat : calcul impossible.' };
      gap = 20 * (nh - na);
    }
    var hv = cross ? niveauAjuste(h.vec, h.ligue, a.ligue) : h.vec;
    var av = cross ? niveauAjuste(a.vec, a.ligue, h.ligue) : a.vec;
    return { p: probMatch(hv, av, gap), gap: gap, cross: cross, nh: nh, na: na };
  }
  // Doubles et triples : toutes les répartitions possibles sont comparées ; on garde celle qui donne
  // la probabilité de grille la plus élevée, pour le nombre de doubles et de triples demandé.
  function choisirPronostics(probas, nd, nt) {
    var n = probas.length;
    if (nd + nt > n) return null;
    var ordres = probas.map(function (p) {
      return ['H', 'D', 'A'].slice().sort(function (x, y) { return p[y] - p[x]; });
    });
    function couverture(i, niveau) {
      if (niveau === 3) return 1;
      var p = probas[i];
      return ordres[i].slice(0, niveau).reduce(function (s, c) { return s + p[c]; }, 0);
    }
    // Toutes les répartitions avec exactement nd doubles et nt triples, dans le même ordre que
    // l’énumération complète : on garde la première meilleure. Les branches impossibles sont coupées.
    var couv = probas.map(function (p, i) { return [0, couverture(i, 1), couverture(i, 2), 1]; });
    var meilleur = null, meilleurProd = -1, niveaux = new Array(n);
    function parcourir(i, d, t) {
      if (i < 0) {
        var prod = 1;
        for (var k = 0; k < n; k++) prod *= couv[k][niveaux[k]];
        if (prod > meilleurProd) { meilleurProd = prod; meilleur = niveaux.slice(); }
        return;
      }
      for (var niveau = 1; niveau <= 3; niveau++) {
        var d2 = d + (niveau === 2 ? 1 : 0), t2 = t + (niveau === 3 ? 1 : 0);
        if (d2 > nd || t2 > nt) continue;
        if ((nd - d2) + (nt - t2) > i) continue;
        niveaux[i] = niveau;
        parcourir(i - 1, d2, t2);
      }
    }
    parcourir(n - 1, 0, 0);
    if (!meilleur) return null;
    var items = meilleur.map(function (niveau, i) {
      var garde = niveau === 3 ? ['H', 'D', 'A'] : ordres[i].slice(0, niveau);
      return {
        pronostic: garde.map(function (c) { return { H: '1', D: 'N', A: '2' }[c]; }).sort().join(''),
        couvert: couverture(i, niveau)
      };
    });
    return { items: items, proba: meilleurProd };
  }
  function calculerGrille(paires, nd, nt) {
    var res = paires.map(function (pr) { return calculMatch(pr.dom, pr.ext); });
    var erreurs = [];
    res.forEach(function (r, i) { if (r.erreur) erreurs.push('Match ' + (i + 1) + ' : ' + r.erreur); });
    if (erreurs.length) return { erreurs: erreurs, matchs: [], proba_grille: null };
    var choix = choisirPronostics(res.map(function (r) { return r.p; }), nd, nt);
    if (!choix) return { erreurs: ['Nombre de doubles et de triples impossible pour ' + paires.length + ' matchs.'], matchs: [], proba_grille: null };
    return {
      erreurs: null,
      proba_grille: arrondir(choix.proba, 6),
      matchs: paires.map(function (pr, i) {
        var r = res[i], c = choix.items[i];
        return {
          n: i + 1,
          ligue: r.cross ? 'UE' : pr.dom.ligue,
          ligue_nom: r.cross ? pr.dom.ligue_nom + ' / ' + pr.ext.ligue_nom : pr.dom.ligue_nom,
          domicile: pr.dom.equipe, exterieur: pr.ext.equipe, cotes: null,
          proba: { '1': arrondir(r.p.H, 4), 'N': arrondir(r.p.D, 4), '2': arrondir(r.p.A, 4) },
          source: 'modele_stats',
          pronostic: c.pronostic,
          confiance: arrondir(c.couvert, 4),
          ecart_niveau_elo: Math.round(r.gap),
          profils: { domicile: profilDe(pr.dom), exterieur: profilDe(pr.ext) }
        };
      })
    };
  }
  // Une grille verrouillée garde ses valeurs ; une grille non verrouillée est recalculée
  // avec les données actuelles (donc à jour après chaque mise à jour des données).
  function resultatGrille(g) {
    if (g.verrouillee) return { erreurs: null, matchs: g.matchs || [], proba_grille: g.proba_grille };
    var paires = [], erreurs = [];
    (g.paires || []).forEach(function (p, i) {
      var h = findTeam(p.dom), a = findTeam(p.ext);
      if (!h || !a) erreurs.push('Match ' + (i + 1) + ' : équipe absente des données actuelles.');
      else paires.push({ dom: h, ext: a });
    });
    if (erreurs.length) return { erreurs: erreurs, matchs: [], proba_grille: null };
    return calculerGrille(paires, g.doubles || 0, g.triples || 0);
  }
  function nouvelleGrille(nom, paires, nd, nt, validite) {
    return {
      id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      nom: nom, format: paires.length, creee: aujourdhuiIso(),
      verrouillee: false, verrouillee_le: null, validite: validite || '', methode: 'stats-niveau-v8',
      doubles: nd, triples: nt,
      paires: paires.map(function (p) {
        return { dom: p.dom.ligue + '|' + p.dom.equipe, ext: p.ext.ligue + '|' + p.ext.equipe };
      }),
      note: NOTE_METHODE

  }
  function figer(g) {
    var res = resultatGrille(g);
    if (res.erreurs) return false;
    g.matchs = res.matchs;
    g.proba_grille = res.proba_grille;
    g.verrouillee = true;
    g.verrouillee_le = new Date().toISOString();
    g.version_donnees = S.version;
    return true;
  }

  // ---------- Stockage (navigateur de cet ordinateur)
  function lireStock() {
    try {
      var brut = window.localStorage.getItem(STORE_KEY);
      if (brut === null) return null;
      var v = JSON.parse(brut);
      return Array.isArray(v) ? v : null;
    } catch (e) { return null; }
  }
  function ecrireStock(liste) {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(liste)); return true; }
    catch (e) { return false; }
  }
  function sauver() { S.stockage = ecrireStock(S.grilles); }
  function initGrilles() {
    var stock = lireStock();
    if (stock === null) {
      S.grilles = JSON.parse(JSON.stringify(DATA.grilles));
      S.stockage = ecrireStock(S.grilles);
      return;
    }
    S.grilles = stock;
    var ajout = false;
    DATA.grilles.forEach(function (g) {
      if (!stock.some(function (x) { return x.id === g.id; })) { S.grilles.push(JSON.parse(JSON.stringify(g))); ajout = true; }
    });
    S.stockage = ajout ? ecrireStock(S.grilles) : true;
  }

  // ---------- Grilles : saisie, aperçu, verrouillage, suppression
  function formVide() {
    var rows = [];
    for (var i = 0; i < FORMAT_DEFAUT; i++) rows.push({ dom: '', ext: '', err: '' });
    return { nom: '', validite: '', format: FORMAT_DEFAUT, doubles: 3, triples: 0, rows: rows, info: '' };
  }
  // Changer de format : les matchs en trop sont retirés (avec un avertissement s’ils étaient remplis)
  function changerFormat(n) {
    var f = S.form;
    if (!f || FORMATS.indexOf(n) === -1 || n === f.rows.length) return;
    var perdus = f.rows.slice(n).some(function (r) { return r.dom.trim() || r.ext.trim(); });
    var rows = f.rows.slice(0, n);
    while (rows.length < n) rows.push({ dom: '', ext: '', err: '' });
    f.rows = rows;
    f.format = n;
    f.choix = null; f.source = null; f.cloture = null;
    f.info = perdus ? 'Les matchs au-delà du ' + n + 'e ont été retirés en passant au format ' + n + '.' : '';
  }
  function resoudreFormulaire(f) {
    var paires = [], ok = true;
    f.rows.forEach(function (r) {
      var msg = '';
      if (!r.dom.trim() && !r.ext.trim()) msg = 'match à compléter.';
      else {
        var h = trouverEquipe(r.dom), a = trouverEquipe(r.ext);
        if (!h) msg = 'équipe introuvable : « ' + r.dom.trim() + ' ».';
        else if (!a) msg = 'équipe introuvable : « ' + r.ext.trim() + ' ».';
        else if (h === a) msg = 'une équipe ne peut pas jouer contre elle-même.';
        else paires.push({ dom: h, ext: a });
      }
      r.err = msg;
      if (msg) ok = false;
    });
    return { ok: ok, paires: paires };
  }
  function apercuHtml(f) {
    var rf = resoudreFormulaire(f);
    var nom = f.nom.trim() || ('Grille du ' + dateFr(aujourdhuiIso()));
    var prixDemande = Math.pow(2, f.doubles) * Math.pow(3, f.triples);
    var entete = '<p class="hint">Prix demandé : ×' + prixDemande + ' (×2 par double, ×3 par triple).</p>' + (f.cloture ? '<p class="hint">Clôture : ' + esc(dateHeureFr(f.cloture)) + '.</p>' : '');
    if (!rf.ok) {
      var manquants = f.rows.map(function (r, i) {
        return r.err ? '<li>Match ' + (i + 1) + ' : ' + esc(r.err) + '</li>' : '';
      }).join('');
      return '<section class="card">' + entete + '<p class="hint">L’aperçu s’affiche dès que les ' + f.rows.length + ' matchs sont complets.</p>' +
        (manquants ? '<ul class="list err">' + manquants + '</ul>' : '') + '</section>';
    }
    var res = calculerGrille(rf.paires, f.doubles, f.triples);
    if (res.erreurs) {
      return '<section class="card">' + entete + '<ul class="list err">' + res.erreurs.map(function (e) {
        return '<li>' + esc(e) + '</li>';
      }).join('') + '</ul></section>';
    }
    var nDoubles = res.matchs.filter(function (m) { return typeDe(m.pronostic) === 'Double'; }).length;
    var nTriples = res.matchs.filter(function (m) { return typeDe(m.pronostic) === 'Triple'; }).length;
    return '<section class="card"><span class="label">Aperçu avant enregistrement</span>' +
      '<h2 style="margin-top:6px">' + esc(nom) + '</h2>' +
      '<div class="kpis"><div class="kpi"><span class="label">Grille complète juste</span><strong>' + probGrille(res.proba_grille) + '</strong></div>' +
      '<div class="kpi"><span class="label">Prix</span><strong>×' + prixDe(res.matchs) + '</strong></div></div>' +
      '<p class="hint">' + nDoubles + ' double(s) et ' + nTriples + ' triple(s), placés là où ils rapportent le plus de probabilité.</p>' +
      '<div class="btns"><button type="button" class="btn primary" data-act="enregistrer" data-lock="1">Enregistrer et verrouiller</button>' +
      '<button type="button" class="btn" data-act="enregistrer" data-lock="0">Enregistrer sans verrouiller</button></div></section>' +
      '<section class="card"><h2>Pronostics match par match</h2>' + res.matchs.map(matchHtml).join('') + '</section>';
  }
  function majApercu() {
    var zone = document.getElementById('apercu-zone');
    if (zone && S.form) zone.innerHTML = apercuHtml(S.form);
  }
  function enregistrerApercu(verrouiller) {
    var f = S.form;
    if (!f) return;
    var rf = resoudreFormulaire(f);
    if (!rf.ok) return;
    var res = calculerGrille(rf.paires, f.doubles, f.triples);
    if (res.erreurs) return;
    var nom = f.nom.trim() || ('Grille du ' + dateFr(aujourdhuiIso()));
    var g = nouvelleGrille(nom, rf.paires, f.doubles, f.triples, f.validite.trim());
    if (f.cloture) g.cloture = f.cloture;
    if (f.source) g.source = f.source;
    if (verrouiller) figer(g);
    S.grilles.push(g);
    sauver();
    S.grilleId = g.id;
    S.nouvelle = false;
    S.form = null;
    S.message = verrouiller ? 'Grille enregistrée et verrouillée.' :
      'Grille enregistrée : ses probabilités restent à jour jusqu’au verrouillage.';
  }
  function verrouiller(id) {
    var i = indexGrille(id);
    if (i === -1 || S.grilles[i].verrouillee) return;
    if (!figer(S.grilles[i])) { S.message = 'Impossible de verrouiller : une équipe est absente des données.'; return; }
    sauver();
    S.message = 'Grille verrouillée : ses probabilités ne changeront plus.';
  }
  function supprimer(id) {
    var i = indexGrille(id);
    if (i === -1 || S.grilles[i].verrouillee) return;
    S.grilles.splice(i, 1);
    S.grilleId = null;
    sauver();
    S.message = 'Grille supprimée.';
  }

  // ---------- Fichiers : CSV (téléchargement et importation), sauvegarde
  function cellule(v) {
    var s = String(v == null ? '' : v);
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function csvGrille(g, res) {
    var lignes = [['N°', 'Domicile', 'Extérieur', 'Championnats', 'Pronostic', 'Type', 'Victoire domicile (%)', 'Nul (%)', 'Victoire extérieur (%)', 'Probabilité couverte (%)']];
    (res.matchs || []).forEach(function (m) {
      var p = m.proba || {};
      lignes.push([m.n, m.domicile, m.exterieur, m.ligue_nom || m.ligue || '', LIBELLE_PRONO[m.pronostic] || m.pronostic,
        typeDe(m.pronostic), fr(p['1'] * 100, 1), fr(p['N'] * 100, 1), fr(p['2'] * 100, 1), fr(m.confiance * 100, 1)]);
    });
    lignes.push([]);
    lignes.push(['Probabilité de la grille complète (%)', '', '', '', '', '', '', '', '', res.proba_grille == null ? '' : fr(res.proba_grille * 100, 2)]);
    lignes.push(['Prix (grilles de base)', '', '', '', '', '', '', '', '', (res.matchs && res.matchs.length) ? '×' + prixDe(res.matchs) : '']);
    lignes.push(['Grille', g.nom]);
    lignes.push(['Créée le', dateFr(g.creee)]);
    lignes.push(['Statut', g.verrouillee ? 'Verrouillée le ' + dateHeureFr(g.verrouillee_le) : 'Non verrouillée : données jusqu’au ' + dateFr(S.derniere)]);
    if (g.validite) lignes.push(['Validation', g.validite]);
    return '﻿' + lignes.map(function (l) { return l.map(cellule).join(';'); }).join('\r\n') + '\r\n';
  }
  function nomFichier(base, ext) {
    return norm(base).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') + ext;
  }
  function telecharger(nom, contenu, type) {
    var blob = new Blob([contenu], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nom;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  // Sur téléphone, le menu d’envoi du système s’ouvre (« Enregistrer dans Fichiers », Mail, Messages…).
  // Sur ordinateur, ou si le téléphone ne peut pas envoyer de fichier, le fichier est téléchargé.
  function surTelephone() {
    return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  }
  function enregistrerFichier(nom, contenu, type, titre) {
    var fichier = null, partage = false;
    try {
      fichier = new File([contenu], nom, { type: type });
      partage = surTelephone() && !!navigator.share && !!navigator.canShare && navigator.canShare({ files: [fichier] });
    } catch (e) { partage = false; }
    if (partage) {
      try {
        navigator.share({ files: [fichier], title: titre || nom }).catch(function (e) {
          if (!e || e.name !== 'AbortError') telecharger(nom, contenu, type);
        });
        return 'partage';
      } catch (e) { /* repli : téléchargement ci-dessous */ }
    }
    telecharger(nom, contenu, type);
    return 'telechargement';
  }
  function sauvegarder() {
    var contenu = JSON.stringify({ application: 'Lotofoot', version: 2, date: new Date().toISOString(), grilles: S.grilles }, null, 1);
    var mode = enregistrerFichier('lotofoot-sauvegarde-' + aujourdhuiIso() + '.json', contenu, 'application/json', 'Sauvegarde Lotofoot');
    S.message = mode === 'partage' ? 'Sauvegarde prête. Garde ce fichier en lieu sûr.' : 'Sauvegarde téléchargée. Garde ce fichier en lieu sûr.';
  }
  // Texte de la grille, à coller dans une note ou un message
  function texteGrille(g, res) {
    var matchs = res.matchs || [];

      '<div class="field"><label for="nom-grille">Nom de la grille</label><input id="nom-grille" class="txtin" type="text" value="' + esc(f.nom) + '" placeholder="Grille du ' + esc(dateFr(aujourdhuiIso())) + '"></div>' +
      '<div class="field"><label for="validite">Fin de validation (facultatif)</label><input id="validite" class="txtin" type="text" value="' + esc(f.validite) + '" placeholder="ex. mercredi 4 novembre 2026, 18 h 40"></div>' +
      '<div class="field"><label for="doubles-n">Nombre de doubles</label><select id="doubles-n">' + optD + '</select></div>' +
      '<div class="field"><label for="triples-n">Nombre de triples</label><select id="triples-n">' + optT + '</select></div>' +
      '<div class="btns">' + (enLigne() ? '<button type="button" class="btn primary" data-act="charger-grille">Charger la grille publiée</button>' : '') + '<label class="btn" for="fichier-csv">Importer un fichier CSV</label>' +
      '<input id="fichier-csv" type="file" accept=".csv,text/csv" style="display:none"></div>' +
      choixHtml + '<div style="margin-top:12px">' + lignes + '</div>' +
      (f.info ? '<p class="hint" style="margin-top:10px">' + esc(f.info) + '</p>' : '') +
      datalist + '</section>' +
      '<div id="apercu-zone">' + apercu + '</div>' +
      '<div class="btns"><button type="button" class="btn" data-act="annuler">Annuler</button></div>';
  }

  // ---------- Affichage : équipes
  function ligues() {
    var seen = {}; var out = [];
    S.equipes.forEach(function (t) { if (!seen[t.ligue]) { seen[t.ligue] = 1; out.push([t.ligue, t.ligue_nom]); } });
    return out;
  }
  function viewEquipes() {
    if (!S.equipes.length) return note('Les statistiques par équipe ne sont pas encore enregistrées.');
    var lgs = ligues();
    if (!S.ligue) S.ligue = lgs[0][0];
    var inLigue = S.equipes.filter(function (t) { return t.ligue === S.ligue; });
    if (!inLigue.some(function (t) { return t.equipe === S.equipe; })) S.equipe = inLigue[0] ? inLigue[0].equipe : '';
    var t = inLigue.filter(function (x) { return x.equipe === S.equipe; })[0];
    var selects = '<div class="field"><label for="sel-ligue">Championnat</label><select id="sel-ligue">' +
      lgs.map(function (l) { return '<option value="' + esc(l[0]) + '"' + (l[0] === S.ligue ? ' selected' : '') + '>' + esc(l[1]) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label for="sel-equipe">Équipe</label><select id="sel-equipe">' +
      inLigue.map(function (x) { return '<option value="' + esc(x.equipe) + '"' + (x.equipe === S.equipe ? ' selected' : '') + '>' + esc(x.equipe) + '</option>'; }).join('') +
      '</select></div>';
    var fiche = '';
    if (t) {
      fiche = '<section class="card"><span class="label">' + esc(t.ligue_nom) + '</span><h2 style="margin-top:6px">' + esc(t.equipe) + '</h2>' +
        '<div class="kpis"><div class="kpi"><span class="label">Elo (dans son championnat)</span><strong>' + esc(Math.round(t.elo)) + '</strong></div>' +
        '<div class="kpi"><span class="label">Rang dans son championnat</span><strong>' + esc(t.rang_elo_dans_le_championnat) + 'e</strong></div></div>' +
        '<div class="scroll"><table><thead><tr><th>Indicateur</th><th class="txt">Valeur</th></tr></thead><tbody>' +
        '<tr><td>À domicile, 20 derniers</td><td class="txt">' + esc(bilan(t.domicile)) + '</td></tr>' +
        '<tr><td>À l’extérieur, 20 derniers</td><td class="txt">' + esc(bilan(t.exterieur)) + '</td></tr>' +
        '<tr><td>Forme, 5 derniers</td><td class="txt">' + esc(t.forme) + '</td></tr>' +
        '<tr><td>Buts pour / contre, 10 derniers</td><td class="txt">' + fr(t.buts_pour, 1) + ' / ' + fr(t.buts_contre, 1) + '</td></tr>' +
        '<tr><td>Tirs cadrés pour / contre, 10 derniers</td><td class="txt">' + fr(t.tirs_cadres_pour, 1) + ' / ' + fr(t.tirs_cadres_contre, 1) + '</td></tr>' +
        '<tr><td>Corners pour, 10 derniers</td><td class="txt">' + fr(t.corners_pour, 1) + '</td></tr>' +
        '<tr><td>Cartons, 10 derniers</td><td class="txt">' + fr(t.cartons, 1) + '</td></tr>' +
        '<tr><td>Jours depuis le dernier match</td><td class="txt">' + esc(t.jours_depuis_dernier_match) + '</td></tr>' +
        '<tr><td>Matchs sur 30 jours</td><td class="txt">' + esc(t.matchs_30_jours) + '</td></tr>' +
        '</tbody></table></div>' +
        '<p class="hint" style="margin-top:10px">Bilans calculés sur les matchs joués jusqu’au ' + esc(dateFr(S.derniere)) + '. V : victoire, N : nul, D : défaite.</p></section>';
    }
    return '<section class="card"><h2>Choisir une équipe</h2>' + selects + '</section>' + fiche;
  }

  // ---------- Affichage : match
  function selHtml() {
    function chip(label, key, which) {
      var t = key ? findTeam(key) : null;
      return '<div class="kpi' + (t ? ' is-fav' : '') + '"><span class="label">' + label + '</span>' +
        (t ? '<span class="kname">' + esc(t.equipe) + '</span><span class="hint">' + esc(t.ligue_nom) + '</span> <button type="button" class="pick" data-clear="' + which + '">Effacer</button>'
           : '<strong>—</strong>') + '</div>';
    }
    return '<div class="kpis">' + chip('Domicile (reçoit)', S.dom, 'dom') + chip('Extérieur', S.ext, 'ext') + '</div>';
  }
  function resultHtml() {
    if (!S.dom || !S.ext) return note('Choisis une équipe à domicile et une équipe à l’extérieur dans le tableau ci-dessous.');
    if (S.dom === S.ext) return note('Choisis deux équipes différentes.');
    var h = findTeam(S.dom), a = findTeam(S.ext);
    if (!h || !a) return note('Données indisponibles pour ces équipes.');
    var r = calculMatch(h, a);
    if (r.erreur) return note(r.erreur);
    var p = r.p, best = 'H';
    if (p.D >= p.H && p.D >= p.A) best = 'D';
    else if (p.A > p.H && p.A >= p.D) best = 'A';
    var favTxt = best === 'D' ? 'Match nul le plus probable (' + pc(p.D) + ')'
      : (best === 'H' ? 'Favori : <strong>' + esc(h.equipe) + '</strong> (' + pc(p.H) + ')'
                      : 'Favori : <strong>' + esc(a.equipe) + '</strong> (' + pc(p.A) + ')');
    var avert = r.cross
      ? '<section class="card"><h2>Estimation très approximative</h2><p>Notes des championnats : ' + esc(h.ligue_nom) + ' ' + r.nh + '/20 et ' + esc(a.ligue_nom) + ' ' + r.na + '/20, soit un écart de ' + r.gap + ' points Elo. Les statistiques de l’équipe du championnat le plus faible sont ramenées à l’échelle du plus fort. Ce calcul entre championnats n’a jamais été testé : les notes sont une estimation.</p></section>'
      : '';
    return '<section class="card"><span class="label">' + (r.cross ? esc(h.ligue_nom) + ' contre ' + esc(a.ligue_nom) : esc(h.ligue_nom)) + '</span>' +
      '<h2 style="margin-top:6px">' + esc(h.equipe) + ' – ' + esc(a.equipe) + '</h2>' +
      '<div class="kpis kpis3">' +
        '<div class="kpi' + (best === 'H' ? ' is-fav' : '') + '"><span class="label">Victoire ' + esc(h.equipe) + '</span><strong>' + pc(p.H) + '</strong></div>' +
        '<div class="kpi' + (best === 'D' ? ' is-fav' : '') + '"><span class="label">Match nul</span><strong>' + pc(p.D) + '</strong></div>' +
        '<div class="kpi' + (best === 'A' ? ' is-fav' : '') + '"><span class="label">Victoire ' + esc(a.equipe) + '</span><strong>' + pc(p.A) + '</strong></div>' +
      '</div>' +
      '<p>' + favTxt + '</p>' +
      '<p class="hint" style="margin-top:8px">Statistiques seules, sans cotes. Ce calcul ne garantit rien.</p></section>' +
      avert +
      '<section class="card"><h2>Les deux équipes</h2>' + duelTable(h, a) + '</section>';
  }
  function duelTable(h, a) {
    function row(label, vh, va) { return '<tr><td>' + esc(label) + '</td><td class="txt">' + esc(vh) + '</td><td class="txt">' + esc(va) + '</td></tr>'; }
    return '<div class="scroll"><table><thead><tr><th>Indicateur</th><th class="txt">' + esc(h.equipe) + '</th><th class="txt">' + esc(a.equipe) + '</th></tr></thead><tbody>' +
      row('Bilan à domicile, 20 derniers', bilan(h.domicile), '—') +
      row('Bilan à l’extérieur, 20 derniers', '—', bilan(a.exterieur)) +
      row('Forme, 5 derniers', h.forme, a.forme) +
      row('Buts pour / contre, 10 derniers', fr(h.buts_pour, 1) + ' / ' + fr(h.buts_contre, 1), fr(a.buts_pour, 1) + ' / ' + fr(a.buts_contre, 1)) +
      row('Tirs cadrés pour / contre, 10 derniers', fr(h.tirs_cadres_pour, 1) + ' / ' + fr(h.tirs_cadres_contre, 1), fr(a.tirs_cadres_pour, 1) + ' / ' + fr(a.tirs_cadres_contre, 1)) +
      row('Corners pour, 10 derniers', fr(h.corners_pour, 1), fr(a.corners_pour, 1)) +
      row('Cartons, 10 derniers', fr(h.cartons, 1), fr(a.cartons, 1)) +
      row('Jours depuis le dernier match', h.jours_depuis_dernier_match, a.jours_depuis_dernier_match) +
      row('Matchs sur 30 jours', h.matchs_30_jours, a.matchs_30_jours) +
      row('Elo (rang dans son championnat)', h.elo + ' (' + h.rang_elo_dans_le_championnat + 'e)', a.elo + ' (' + a.rang_elo_dans_le_championnat + 'e)') +
      '</tbody></table></div>';
  }
  function tableHtml() {
    var q = norm(S.q);
    var rows = S.equipes.filter(function (t) {
      return !q || norm(t.equipe).indexOf(q) !== -1 || norm(t.ligue_nom).indexOf(q) !== -1;
    });
    rows.sort(function (a, b) { return (a.ligue_nom + ' ' + a.equipe).localeCompare(b.ligue_nom + ' ' + b.equipe); });
    if (!rows.length) return '<p class="hint">Aucune équipe trouvée.</p>';
    return '<table><thead><tr><th>Équipe</th><th class="txt">Domicile</th><th class="txt">Extérieur</th><th></th></tr></thead><tbody>' +
      rows.map(function (t) {
        var k = t.ligue + '|' + t.equipe;
        return '<tr><td><strong>' + esc(t.equipe) + '</strong><br><span class="hint">' + esc(t.ligue_nom) + '</span></td>' +
          '<td class="txt">' + esc(bilanCourt(t.domicile)) + '</td><td class="txt">' + esc(bilanCourt(t.exterieur)) + '</td>' +
          '<td><button type="button" class="pick' + (S.dom === k ? ' on' : '') + '" data-set="dom" data-team="' + esc(k) + '">Dom.</button> ' +
          '<button type="button" class="pick' + (S.ext === k ? ' on' : '') + '" data-set="ext" data-team="' + esc(k) + '">Ext.</button></td></tr>';
      }).join('') + '</tbody></table>';
  }
  function viewMatch() {
    if (!S.equipes.length) return note('Les équipes ne sont pas encore enregistrées.');
    return '<section class="card"><h2>Match</h2><div id="match-sel">' + selHtml() + '</div>' +
      '<div id="match-result">' + resultHtml() + '</div></section>' +
      '<section class="card"><h2>Choisir les équipes dans le tableau</h2>' +
      '<p class="hint">« Dom. » : équipe qui reçoit. « Ext. » : équipe visiteuse. Les 16 championnats sont listés.</p>' +
      '<div class="field"><label for="q">Chercher une équipe ou un championnat</label><input id="q" class="txtin" type="search" autocomplete="off" value="' + esc(S.q) + '"></div>' +
      '<div id="match-table" class="scroll">' + tableHtml() + '</div></section>';
  }

  // ---------- Affichage : stats et méthode
  function notesHtml() {
    var ns = (S.stats && S.stats.notes) || [];
    if (!ns.length) return '';
    return '<section class="card"><h2>Notes des championnats sur 20</h2>' +
      '<p class="hint">Classement estimé du niveau de chaque championnat, pas une mesure : les données ne relient pas les championnats entre eux. 1 point de note = 20 points Elo d’écart entre deux championnats.</p>' +
      '<div class="scroll"><table><thead><tr><th>Championnat</th><th class="txt">Note /20</th></tr></thead><tbody>' +
      ns.map(function (n) { return '<tr><td>' + esc(n.nom) + '</td><td class="txt">' + (n.note == null ? '—' : esc(n.note)) + '</td></tr>'; }).join('') +
      '</tbody></table></div></section>';
  }
  function viewStats() {
    var s = S.stats;
    if (!s) return note('Les statistiques ne sont pas encore enregistrées.');
    var comp = (s.comparaison || []).map(function (c) {
      return '<tr><td>' + esc(c.nom) + '</td><td>' + fr(c.erreur_test, 4) + '</td><td>' + (c.precision_test == null ? '—' : fr(c.precision_test, 1) + ' %') + '</td>' +
        '<td>' + (c.erreur_recent == null ? '—' : fr(c.erreur_recent, 4)) + '</td><td>' + (c.precision_recent == null ? '—' : fr(c.precision_recent, 1) + ' %') + '</td></tr>';
    }).join('');
    var base = (s.base_stats || []).map(function (b) {
      return '<tr><td>' + esc(b.nom) + '</td><td>' + nb(b.n) + '</td><td>' + fr(b.H, 1) + '</td><td>' + fr(b.D, 1) + '</td><td>' + fr(b.A, 1) + '</td></tr>';
    }).join('');
    var top = (s.top_equipes || []).map(function (t) {
      return '<li><strong>' + esc(t.nom) + '</strong> : ' + t.equipes.map(function (e) { return esc(e); }).join(', ') + '</li>';
    }).join('');
    return '<section class="card"><h2>Qualité des prédictions</h2>' +
      '<p class="hint">Erreur : plus elle est basse, mieux c’est. Précision : part des matchs où le pronostic était juste. Chaque méthode a été testée sur des matchs qu’elle n’a pas vus pendant son calibrage.</p>' +
      '<div class="scroll"><table><thead><tr><th>Méthode</th><th>Erreur 2024-25/25-26</th><th>Précision</th><th>Erreur 2026-27</th><th>Précision</th></tr></thead><tbody>' + comp + '</tbody></table></div>' +
      '<p class="hint" style="margin-top:10px">Test : ' + nb(s.n_matchs_test) + ' matchs (2024-25 et 2025-26) ; 2026-27 : ' + nb(s.n_matchs_recent) + ' matchs joués jusqu’au ' + esc(dateFr(S.derniere)) + '. Ces tests ne portent que sur des matchs d’un même championnat.</p></section>' +
      notesHtml() + '<section class="card"><h2>Résultats par championnat</h2>' +
      '<p class="hint">Fréquence de chaque issue sur ' + esc(s.periode_stats) + '.</p>' +
      '<div class="scroll"><table><thead><tr><th>Championnat</th><th>Matchs</th><th>1</th><th>N</th><th>2</th></tr></thead><tbody>' + base + '</tbody></table></div></section>' +
      '<section class="card"><h2>Équipes les plus fortes (Elo)</h2>' +
      '<p class="hint">Classement à la fin des données, dans chaque championnat. Ces classements ne se comparent pas d’un championnat à l’autre.</p>' +
      '<ul class="list">' + top + '</ul></section>';
  }
  function viewMethode() {
    return '<section class="card method">' +
      '<h3>Ce que fait l’application</h3>' +
      '<p>Elle calcule, pour un match, la probabilité de victoire à domicile, de match nul et de victoire à l’extérieur, à partir des statistiques des deux équipes. Elle ne tient compte d’aucune cote de bookmaker.</p>' +
      '<h3>L’onglet Match</h3>' +
      '<ul><li>Tu choisis l’équipe à domicile et l’équipe à l’extérieur dans le tableau, parmi les 16 championnats.</li>' +
      '<li>Entre deux équipes d’un même championnat, le calcul utilise les 25 statistiques des deux équipes, dont l’écart de classement Elo.</li>' +
      '<li>Entre deux championnats, les statistiques de l’équipe du championnat le plus faible sont ramenées à l’échelle du plus fort : ses écarts à la moyenne de son championnat sont réduits dans le rapport entre les deux notes, puis recentrés sur la moyenne du championnat le plus fort. Les statistiques de l’équipe du championnat le plus fort ne changent pas. Ensuite, l’écart de niveau s’ajoute à l’écart Elo : 1 point de note = 20 points Elo. Le classement des championnats est une estimation.</li></ul>' +
      '<h3>Les grilles</h3>' +
      '<ul><li>Une grille se crée avec ses matchs, au format Loto Foot 7, 8 ou 15 : tu saisis les équipes, ou tu importes un fichier CSV (même format que celui que l’application enregistre). Le format est reconnu tout seul. L’aperçu se remplit tout seul.</li>' +
      '<li>En ligne, « Charger la grille publiée » remplit le formulaire avec la grille ouverte la plus proche de sa clôture, reprise de ruedesjoueurs.com (seule la liste des matchs est reprise, ni pronostics ni cotes). Si plusieurs grilles sont ouvertes, tu choisis celle que tu veux. Une grille enregistrée reste à jour jusqu’à sa clôture, puis elle se verrouille seule. Les équipes hors des 16 championnats suivis ne peuvent pas être calculées.</li>' +
      '<li>Doubles et triples : tu choisis leur nombre. L’application les place là où ils rapportent le plus de probabilité, en comparant toutes les possibilités. Prix : ×2 par double, ×3 par triple.</li>' +
      '<li>Une grille non verrouillée reste à jour : ses probabilités sont recalculées à chaque mise à jour des données. Une fois verrouillée, elle garde ses valeurs et ne change plus.</li>' +
      '<li>Enregistrement : chaque grille peut être enregistrée en fichier CSV, à ouvrir dans un tableur. Sur téléphone, le menu d’envoi s’ouvre (« Enregistrer dans Fichiers », Mail, Messages…). « Copier le texte » copie la grille à coller ailleurs.</li>' +
      '<li>Les grilles sont gardées dans le navigateur de cet ordinateur. La sauvegarde (onglet Grille) crée un fichier à garder ailleurs, et à restaurer si besoin.</li></ul>' +
      '<h3>Les statistiques prises en compte</h3>' +
      '<ul><li>Victoires, nuls et défaites à domicile (équipe qui reçoit) et à l’extérieur, sur les 20 derniers matchs.</li>' +
      '<li>Forme sur les 5 derniers matchs, et buts marqués et encaissés sur les 10 derniers.</li>' +
      '<li>Tirs cadrés, corners et cartons sur les 10 derniers matchs.</li>' +
      '<li>Jours de repos depuis le dernier match, nombre de matchs sur 30 jours.</li>' +
      '<li>Classement Elo, calculé sur les résultats de chaque championnat.</li></ul>' +
      '<h3>D’où viennent les données</h3>' +
      '<p>Résultats et statistiques de match publiés par football-data.co.uk, pour 16 championnats, des saisons 2015-16 à 2026-27. Les coupes d’Europe ne sont pas couvertes, et les championnats qui ne figurent pas dans cette liste non plus, comme le championnat tchèque.</p>' +
      '<p>Les données sont celles du ' + esc(dateFr(S.derniere)) + '.</p>' +
      '<h3>Mises à jour</h3>' +
      '<ul><li>Version en ligne : à chaque ouverture avec connexion, l’application récupère la dernière version de ses données et de son code. Sans connexion, elle garde la dernière version reçue et fonctionne hors ligne.</li>' +
      '<li>Version fichier (Lotofoot.html) : pas de mise à jour automatique. Pour une version plus récente, il faut remplacer le fichier.</li></ul>' +
      '<h3>Ce que montrent les tests</h3>' +
      '<p>Sur des matchs d’un même championnat, le modèle fait mieux que les probabilités moyennes de l’historique. Il n’a pas été testé sur des matchs entre championnats.</p>' +
      '<h3>Limites</h3>' +
      '<ul><li>Le Lotofoot ne tient compte que du score à la fin du temps réglementaire : prolongations et tirs au but ne comptent pas.</li>' +
      '<li>Les blessures, compositions d’équipe et absences de dernière minute ne sont pas prises en compte.</li>' +
      '<li>Les gains ne sont pas estimés, car les rapports des grilles ne sont pas disponibles.</li>' +
      '<li>On ne sait pas quels pronostics les autres joueurs choisissent. Quand un pronostic est très choisi, le gain se partage entre plus de gagnants.</li></ul>' +
      '<h3>Responsabilité</h3>' +
      '<p>Un pronostic statistique ne garantit aucun gain. Le taux de redistribution d’un jeu de pronostics est inférieur à 100 %, donc l’espérance de gain est négative. Ne joue que ce que tu peux te permettre de perdre.</p>' +
      '</section>';
  }

  // ---------- Cadre, actions et événements
  function panel() {
    if (S.tab === 'grille') return viewGrille();
    if (S.tab === 'equipes') return viewEquipes();
    if (S.tab === 'match') return viewMatch();
    if (S.tab === 'stats') return viewStats();
    return viewMethode();
  }
  function render() {
    verrouillerEchues();
    var tabs = '<nav class="tabs" role="tablist" aria-label="Sections">' + TABS.map(function (t) {
      return '<button type="button" role="tab" id="tab-' + t[0] + '" aria-selected="' + (S.tab === t[0]) +
        '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</nav>';
    app.innerHTML =
      '<header class="head"><h1>Lotofoot</h1>' +
      '<p>Pronostics et statistiques calculés à partir des résultats et des statistiques de match. Aucune cote de bookmaker. Fonctionne sans connexion.</p></header>' +
      tabs +
      '<div role="tabpanel" aria-labelledby="tab-' + S.tab + '">' + panel() + '</div>' +
      '<p class="foot-note">Sources : football-data.co.uk (résultats et statistiques de match). Données : version ' + esc(S.version) + '. ' + esc(S.miseAJour) + '</p>';
  }
  function agir(action, el) {
    if (action !== 'copier') S.texteCopie = '';
    if (action === 'nouvelle') { S.nouvelle = true; S.form = formVide(); S.message = ''; }
    else if (action === 'annuler') { S.nouvelle = false; S.form = null; }
    else if (action === 'enregistrer') { enregistrerApercu(el.getAttribute('data-lock') === '1'); }
    else if (action === 'csv') {
      var gc = courante();
      if (gc) {
        var mode = enregistrerFichier(nomFichier(gc.nom, '') + '.csv', csvGrille(gc, resultatGrille(gc)), 'text/csv;charset=utf-8', gc.nom);
        S.message = mode === 'partage' ? '' : 'Grille téléchargée au format CSV.';
      }
    }
    else if (action === 'copier') { copierGrille(courante()); }
    else if (action === 'charger-grille') { chargerGrille(); }
    else if (action === 'verrouiller') {
      if (window.confirm('Verrouiller cette grille ? Ses probabilités ne changeront plus, et elle ne pourra plus être supprimée.')) verrouiller(S.grilleId);
    }
    else if (action === 'supprimer') {
      if (window.confirm('Supprimer cette grille ? Cette action est définitive.')) supprimer(S.grilleId);
    }
    else if (action === 'sauvegarder') { sauvegarder(); }
    render();
  }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) { S.tab = t.getAttribute('data-tab'); S.message = ''; S.texteCopie = ''; render(); return; }
    var g = e.target.closest('[data-grille]');
    if (g) { S.grilleId = g.getAttribute('data-grille'); S.message = ''; S.texteCopie = ''; render(); return; }
    var b = e.target.closest('[data-act]');
    if (b) { agir(b.getAttribute('data-act'), b); return; }
    var st = e.target.closest('[data-set]');
    if (st) {
      var which = st.getAttribute('data-set'), key = st.getAttribute('data-team');
      if (which === 'dom') S.dom = key; else S.ext = key;
      render(); return;
    }
    var cl = e.target.closest('[data-clear]');
    if (cl) {
      if (cl.getAttribute('data-clear') === 'dom') S.dom = ''; else S.ext = '';
      render(); return;
    }
  });
  app.addEventListener('input', function (e) {
    var el = e.target;
    var champ = el.getAttribute('data-champ');
    if (champ && S.form) {
      S.form.rows[Number(el.getAttribute('data-i'))][champ] = el.value;
      S.form.source = null; S.form.choix = null;
      majApercu();
      return;
    }
    if (el.id === 'nom-grille' && S.form) { S.form.nom = el.value; majApercu(); return; }
    if (el.id === 'validite' && S.form) { S.form.validite = el.value; return; }
    if (el.id === 'q') {
      S.q = el.value;
      var box = document.getElementById('match-table');
      if (box) box.innerHTML = tableHtml();
    }
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'sel-ligue') { S.ligue = el.value; S.equipe = ''; render(); }
    else if (el.id === 'sel-equipe') { S.equipe = el.value; render(); }
    else if (el.id === 'format-n' && S.form) { changerFormat(Number(el.value)); render(); }
    else if (el.id === 'choix-grille' && S.form) { var choisie = (S.form.choix || []).filter(function (x) { return String(x.numero) === el.value; })[0]; if (choisie) appliquerGrillePubliee(choisie); render(); }
    else if (el.id === 'doubles-n' && S.form) { S.form.doubles = Number(el.value); majApercu(); }
    else if (el.id === 'triples-n' && S.form) { S.form.triples = Number(el.value); majApercu(); }
    else if (el.id === 'fichier-csv' && S.form) {
      lireFichier(el.files && el.files[0], function (texte) { appliquerCsv(texte); render(); });
    }
    else if (el.id === 'fichier-restaurer') {
      lireFichier(el.files && el.files[0], function (texte) { restaurer(texte); render(); });
    }
  });

  initGrilles();
  S.miseAJour = /^https?:$/.test(location.protocol) ? '' : 'Version fichier : pas de mise à jour automatique.';
  render();
  verifierMiseAJour().then(verifierGrillesPubliees).then(function () { render(); });
})();
</script>
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
